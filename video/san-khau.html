<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AgiViet · sân khấu quay video</title>
<link rel="stylesheet" href="/ban/css/fonts.css">
<style>
  :root { --reu: #235c45; --reu-dam: #122e23; --nang: #f5b83d; --kem: #fbecc8; --f: 'Be Vietnam Pro', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b1f17; font-family: var(--f); color: #fff; }
  #san { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(1200px 800px at 70% 30%, #1d4a38 0%, #0f271d 55%, #0a1c14 100%); }
  #san::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size: 28px 28px; opacity: .6; }
  /* khung thiết bị */
  .tb { position: absolute; transition: transform 1s cubic-bezier(.2,.7,.2,1), opacity .8s ease, left 1s cubic-bezier(.2,.7,.2,1), top 1s cubic-bezier(.2,.7,.2,1); transform-origin: top left; opacity: 0; }
  .tb.hien { opacity: 1; }
  #tb-dt { width: 430px; height: 884px; border-radius: 56px; background: #0a0f0d; padding: 20px; box-shadow: 0 40px 80px rgba(0,0,0,.55), inset 0 0 0 2px #2c3a33; }
  #tb-dt iframe { width: 390px; height: 844px; border: 0; border-radius: 38px; background: #fff; display: block; }
  #tb-lap { width: 1500px; }
  #tb-lap .man { background: #0a0f0d; padding: 22px 22px 30px; border-radius: 26px 26px 10px 10px; box-shadow: 0 40px 80px rgba(0,0,0,.55), inset 0 0 0 2px #2c3a33; }
  #tb-lap iframe { width: 1440px; height: 900px; border: 0; border-radius: 8px; background: #fff; display: block; }
  #tb-lap .de { height: 22px; margin: 0 -70px; background: linear-gradient(#c9cfcb, #8e9792); border-radius: 0 0 24px 24px; }
  .nhan-tb { position: absolute; top: -58px; left: 0; display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 26px; white-space: nowrap; }
  .nhan-tb img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 3px solid var(--nang); }
  .nhan-tb small { font-weight: 500; font-size: 20px; color: #b8cdbf; }
  /* con trỏ giả */
  #tro { position: absolute; left: 0; top: 0; width: 34px; height: 34px; z-index: 50; pointer-events: none; transition: transform .6s cubic-bezier(.3,.7,.2,1), opacity .3s; opacity: 0; }
  #tro svg { width: 34px; height: 34px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); }
  .gon { position: absolute; z-index: 49; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 4px solid var(--nang); pointer-events: none; animation: gon .6s ease-out forwards; }
  @keyframes gon { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
  /* chữ động */
  #chu { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
  .lop { position: absolute; transition: opacity .8s ease, transform .9s cubic-bezier(.2,.7,.2,1); }
  .vao { opacity: 0; transform: translateY(40px); }
  .ra { opacity: 0 !important; transform: translateY(-30px) !important; }
  .to { font-size: 76px; font-weight: 700; line-height: 1.12; letter-spacing: -.02em; }
  .to em { font-style: normal; color: var(--nang); }
  .vua { font-size: 40px; font-weight: 600; line-height: 1.35; color: #dbe8df; }
  .nho { font-size: 28px; color: #b8cdbf; }
  .anh-nen { position: absolute; inset: 0; z-index: 1; }
  .anh-nen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.4s ease; filter: brightness(.55) saturate(1.05); }
  .anh-nen img.on { opacity: 1; animation: ken 9s ease-out forwards; }
  @keyframes ken { from { transform: scale(1.12); } to { transform: scale(1); } }
  .the-nv { position: absolute; width: 640px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 28px; padding: 30px; display: flex; gap: 26px; align-items: center; backdrop-filter: blur(6px); }
  .the-nv img { width: 150px; height: 150px; border-radius: 22px; object-fit: cover; }
  .the-nv b { display: block; font-size: 40px; }
  .the-nv span { font-size: 26px; color: #c7dacd; line-height: 1.4; }
  .kho { position: relative; white-space: nowrap; display: inline-flex; align-items: center; gap: 22px; font-size: 34px; font-weight: 600; background: rgba(0,0,0,.28); border-left: 6px solid #e0724a; border-radius: 16px; padding: 20px 30px; }
  .kho i { font-style: normal; width: 52px; height: 52px; border-radius: 14px; background: #e0724a; display: grid; place-items: center; font-size: 30px; }
  .logo { display: flex; align-items: center; gap: 22px; }
  .logo img { width: 110px; height: 110px; background: #fff; border-radius: 28px; padding: 12px; }
  .logo b { font-size: 96px; } .logo b span { color: var(--nang); }
  .chip-buoc { position: absolute; z-index: 30; left: 50%; top: 26px; translate: -50% 0; white-space: nowrap; display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 700; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.2); padding: 14px 24px; border-radius: 18px; transition: opacity .5s, transform .5s; }
  .chip-buoc .so { background: var(--nang); color: var(--reu-dam); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
  .dong-tien { font-size: 40px; font-weight: 600; display: grid; grid-template-columns: 90px 1fr; gap: 10px 20px; align-items: center; }
  .dong-tien .k { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; font-size: 38px; font-weight: 700; }
  .thanh-tien { height: 30px; border-radius: 16px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 8px; }
  .thanh-tien i { display: block; height: 100%; width: 0; border-radius: 16px; transition: width 1.6s cubic-bezier(.2,.7,.2,1); }
  .nguyen-tac { display: grid; gap: 26px; }
  .nguyen-tac div { display: flex; gap: 22px; align-items: center; font-size: 38px; font-weight: 600; }
  .nguyen-tac i { font-style: normal; width: 66px; height: 66px; flex-shrink: 0; border-radius: 18px; background: rgba(245,184,61,.18); color: var(--nang); display: grid; place-items: center; font-size: 34px; font-weight: 700; }
  .goi { display: flex; gap: 26px; }
  .goi div { width: 400px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); border-radius: 26px; padding: 30px; }
  .goi div.noi { border: 3px solid var(--nang); }
  .goi b { display: block; font-size: 30px; color: #c7dacd; font-weight: 600; }
  .goi strong { display: block; font-size: 54px; margin: 8px 0; }
  .goi span { font-size: 24px; color: #c7dacd; }
  /* phụ đề */
  #phu-de { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); z-index: 60; max-width: 1500px; text-align: center; font-size: 36px; font-weight: 600; line-height: 1.35; padding: 12px 30px; border-radius: 16px; background: rgba(8, 20, 14, .72); color: #fff; opacity: 0; transition: opacity .25s; }
  #phu-de.on { opacity: 1; }
  #phu-de.nv { color: var(--kem); font-style: italic; }
  #man-den { position: absolute; inset: 0; background: #000; z-index: 90; opacity: 1; transition: opacity 1.2s ease; pointer-events: none; }
</style>
</head>
<body>
<div id="san">
  <div class="anh-nen" id="anh-nen"></div>
  <div class="tb" id="tb-lap"><div class="nhan-tb" id="nhan-lap"></div><div class="man"><iframe id="if-lap" title="App Thu mua"></iframe></div><div class="de"></div></div>
  <div class="tb" id="tb-dt"><div class="nhan-tb" id="nhan-dt"></div><iframe id="if-dt" title="App Nhà sản xuất"></iframe></div>
  <div id="chu"></div>
  <div class="chip-buoc" id="chip" style="opacity:0"></div>
  <div id="tro"><svg viewBox="0 0 24 24"><path d="M4 2l16 9-7 1.6L9.6 20z" fill="#fff" stroke="#122e23" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
  <div id="phu-de"></div>
  <div id="man-den"></div>
</div>
<script>
(async () => {
  const L = await (await fetch('lich.json')).json();
  const $ = s => document.querySelector(s);
  const ngu = ms => new Promise(r => setTimeout(r, ms));
  const IF = { dt: $('#if-dt'), lap: $('#if-lap') };
  const TB = { dt: $('#tb-dt'), lap: $('#tb-lap') };
  const lech = [];
  let T0 = 0, canhBd = 0;
  const bayGio = () => (performance.now() - T0) / 1000;
  const den = async giay => { const con = canhBd + giay - bayGio(); if (con > 0) await ngu(con * 1000); };

  /* ---------- thiết bị: vị trí, tỉ lệ ---------- */
  function datTb(k, { x, y, s = 1, hien = true }) { const t = TB[k]; t.style.left = x + 'px'; t.style.top = y + 'px'; t.style.transform = `scale(${s})`; t.classList.toggle('hien', hien); }
  function nhan(k, anh, ten, phu) { $('#nhan-' + k).innerHTML = anh ? `<img src="${anh}" alt="">${ten}<small>${phu}</small>` : ''; }
  async function mo(k, url, cho = 900) {
    await new Promise(r => { IF[k].onload = r; IF[k].src = url; });
    const d = IF[k].contentDocument;
    d.head.insertAdjacentHTML('beforeend', '<style>html{scroll-behavior:smooth}.dai-mo-phong,#av-dang-xuat{display:none!important}</style>');
    await ngu(cho);
  }
  const W = k => IF[k].contentWindow, D = k => IF[k].contentDocument;
  async function tim(k, sel, ms = 5000) {
    const t = performance.now();
    while (performance.now() - t < ms) {
      const el = [...D(k).querySelectorAll(sel)].find(e => e.getClientRects().length && getComputedStyle(e).visibility !== 'hidden');
      if (el) return el;
      await ngu(80);
    }
    lech.push('không thấy ' + k + ' ' + sel + ' @' + bayGio().toFixed(1));
    return null;
  }
  function viTri(k, el) {
    const fr = IF[k].getBoundingClientRect(), s = fr.width / IF[k].offsetWidth, r = el.getBoundingClientRect();
    return { x: fr.left + (r.left + r.width / 2) * s, y: fr.top + (r.top + r.height / 2) * s };
  }
  const tro = $('#tro');
  async function diTro(k, el) {
    el.scrollIntoView({ block: 'center', behavior: 'smooth' }); await ngu(350);
    const p = viTri(k, el); tro.style.opacity = 1; tro.style.transform = `translate(${p.x - 6}px, ${p.y - 4}px)`; await ngu(620);
    return viTri(k, el);
  }
  function gon(p) { const g = document.createElement('div'); g.className = 'gon'; g.style.left = p.x + 'px'; g.style.top = p.y + 'px'; $('#san').appendChild(g); setTimeout(() => g.remove(), 700); }
  async function bam(k, sel, sau = 500) { const el = await tim(k, sel); if (!el) return; const p = await diTro(k, el); gon(p); el.click(); await ngu(sau); }
  async function go(k, sel, chu, sau = 250) {
    const el = await tim(k, sel); if (!el) return; const p = await diTro(k, el); gon(p); el.focus(); el.value = '';
    for (const c of chu) { el.value += c; el.dispatchEvent(new (W(k).Event)('input', { bubbles: true })); await ngu(45); }
    await ngu(sau);
  }
  async function chon(k, sel, gt, sau = 400) { const el = await tim(k, sel); if (!el) return; const p = await diTro(k, el); gon(p); el.value = gt; el.dispatchEvent(new (W(k).Event)('change', { bubbles: true })); await ngu(sau); }
  const anTro = () => { tro.style.opacity = 0; };

  /* ---------- chữ động ---------- */
  const chu = $('#chu');
  function lop(html, st) { const e = document.createElement('div'); e.className = 'lop vao'; e.innerHTML = html; Object.assign(e.style, st); chu.appendChild(e); requestAnimationFrame(() => requestAnimationFrame(() => e.classList.remove('vao'))); return e; }
  async function xoaChu(ms = 700) { [...chu.children].forEach(e => e.classList.add('ra')); await ngu(ms); chu.innerHTML = ''; }
  function chip(so, t) { const c = $('#chip'); if (!t) { c.style.opacity = 0; return; } c.innerHTML = `<span class="so">${so}</span>${t}`; c.style.opacity = 1; }
  const anhNen = $('#anh-nen');
  function nen(ds) { anhNen.innerHTML = ds.map(a => `<img src="${a}" alt="">`).join(''); }
  function nenSo(i) { [...anhNen.children].forEach((e, k) => e.classList.toggle('on', k === i)); }

  /* ---------- phụ đề theo mốc từng từ ---------- */
  const doan = [];
  for (const c of L.canh) for (const cau of c.cau) {
    let cum = [], dau = null;
    const day = (cuoi) => { if (cum.length) doan.push({ bd: dau, kt: cuoi, t: cum.join(' '), nv: cau.g !== 'dan' }); cum = []; dau = null; };
    const chuGoc = cau.t.split(/\s+/);
    cau.tu.forEach((w, i) => {
      const tAbs = c.bat_dau + cau.bd + w.bd, chuI = chuGoc.length === cau.tu.length ? chuGoc[i] : w.chu;
      if (dau === null) dau = tAbs;
      cum.push(chuI);
      const dai = cum.join(' ').length, dauCau = /[.?!]$/.test(chuI), phay = /[,:;]$/.test(chuI);
      if (dauCau || (phay && dai > 26) || dai > 62) day(tAbs + w.d + .25);
    });
    day(c.bat_dau + cau.bd + cau.dai + .2);
  }
  // nối liền: mỗi đoạn hiện tới lúc đoạn kế bắt đầu (nếu sát nhau)
  doan.forEach((d, i) => { const k = doan[i + 1]; if (k && k.bd - d.kt < .5) d.kt = k.bd - .02; });
  const pd = $('#phu-de');
  function vePhuDe() {
    const t = bayGio(), d = doan.find(x => t >= x.bd && t < x.kt);
    if (d) { if (pd.textContent !== (d.nv ? '“' + d.t + '”' : d.t)) pd.textContent = d.nv ? '“' + d.t + '”' : d.t; pd.classList.add('on'); pd.classList.toggle('nv', d.nv); } else pd.classList.remove('on');
    if (t < L.tong_giay + 1) requestAnimationFrame(vePhuDe);
  }

  /* ---------- chuẩn bị dữ liệu mẫu ---------- */
  localStorage.clear(); sessionStorage.clear();
  localStorage.setItem('av.quay-video', '1');
  const A = '/ban/assets/anh/mh/';
  nen([A + 'mango.jpg', A + 'dragon-fruit.jpg', A + 'shrimp.jpg', A + 'jackfruit.jpg']);
  datTb('dt', { x: 1440, y: 110, s: 1, hien: false }); datTb('lap', { x: 100, y: 160, s: .6, hien: false });
  await Promise.all([mo('dt', '/ban/bat-dau.html#chao-mung', 300), mo('lap', '/mua/dang-nhap.html', 300)]);
  await Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })));

  /* ---------- các cảnh ---------- */
  const CANH = {
    async mo() {
      $('#man-den').style.opacity = 0;
      nenSo(0);
      lop(`<div class="nho" style="letter-spacing:.2em;text-transform:uppercase;color:var(--nang)">Đồng bằng sông Cửu Long</div>`, { left: '140px', top: '380px' });
      await den(1.2);
      lop(`<div class="to">Mỗi mùa thu hoạch,<br>nông sản đổi chủ<br>bằng <em>một lời hứa miệng</em>.</div>`, { left: '140px', top: '440px' });
      await den(4.6); nenSo(1); await den(7.8); nenSo(2);
      await den(9.2); await xoaChu();
      lop(`<div class="logo"><img src="/ban/assets/mark.svg" alt=""><b>Agi<span>Viet</span></b></div>`, { left: '600px', top: '380px' });
      await den(10.2);
      lop(`<div class="vua" style="font-size:52px;color:#fff">Tìm đúng mối, <span style="color:var(--nang)">chốt đúng giá</span>.</div>`, { left: '610px', top: '560px' });
    },
    async 'van-de'() {
      await xoaChu(); nenSo(3);
      [...anhNen.children].forEach(i => i.style.filter = 'brightness(.25) blur(4px)');
      lop(`<div class="the-nv"><img src="${A}mango.jpg" alt=""><div><b>Chị Năm</b><span>Tự trồng · Mỹ Xương, Cao Lãnh<br>10 tấn xoài · hái tuần sau</span></div></div>`, { left: '120px', top: '150px' });
      await den(3.6);
      lop(`<div class="the-nv"><img src="${A}jackfruit.jpg" alt=""><div><b>Anh Trí</b><span>Nhà máy sấy Đồng Xanh<br>Cần 20 tấn xoài, 8 tấn mít</span></div></div>`, { left: '1160px', top: '150px' });
      await den(6.8);
      lop(`<div style="width:360px;border-top:6px dashed rgba(255,255,255,.35);position:relative"><span style="position:absolute;left:150px;top:-44px;font-size:56px;font-weight:700;color:var(--nang)">?</span></div>`, { left: '780px', top: '270px' });
      await den(9.6);
      lop(`<div class="kho"><i>₫</i>Giá cao chưa chắc được nhiều tiền</div>`, { left: '120px', top: '520px' });
      await den(13.2);
      lop(`<div class="kho"><i>⚖</i>Cân xong: 5.020 kg hay 5.040 kg?</div>`, { left: '120px', top: '650px' });
      await den(16.4);
      lop(`<div class="kho"><i>✉</i>“Đã chuyển khoản”… mà tiền chưa về</div>`, { left: '120px', top: '780px' });
    },
    async 'gioi-thieu'() {
      await xoaChu(); anhNen.style.transition = 'opacity 1s'; anhNen.style.opacity = 0;
      lop(`<div class="logo" style="transform:scale(.7);transform-origin:left"><img src="/ban/assets/mark.svg" alt=""><b>Agi<span>Viet</span></b></div>`, { left: '120px', top: '120px' });
      lop(`<div class="to" style="font-size:64px">Hai ứng dụng.<br><em>Một mã đơn.</em></div>`, { left: '120px', top: '330px' });
      await den(2.2);
      nhan('lap', '/mua/assets/anh/mango.jpg', 'App Thu mua', '· cho vựa, nhà máy');
      datTb('lap', { x: 660, y: 330, s: .74 });
      await den(3.4);
      nhan('dt', A + 'mango.jpg', 'App Nhà sản xuất', '· cho bà con');
      datTb('dt', { x: 1440, y: 150, s: .98 });
      await den(6.4);
      lop(`<div class="vua" style="font-size:34px">Chạy ngay trên điện thoại, máy tính.<br>Không cần cài đặt.</div>`, { left: '120px', top: '600px' });
    },
    async 'tri-dang-ky'() {
      await xoaChu();
      datTb('dt', { x: 2000, y: 150, s: .98, hien: false });
      nhan('lap', '/mua/assets/anh/mango.jpg', 'Anh Trí', '· Nhà máy sấy Đồng Xanh');
      datTb('lap', { x: 270, y: 150, s: .92 });
      chip(1, 'Bên mua đăng ký tổ chức');
      await den(1.4);
      await go('lap', '#to-chuc', 'Nhà máy sấy Đồng Xanh');
      await go('lap', '#nguoi', 'Anh Trí');
      await go('lap', '#sdt', '0909 000 456');
      await bam('lap', '[data-tiep]', 400);
      await bam('lap', '[data-dien-otp]', 250);
      await bam('lap', '[data-tiep]', 400);
      await bam('lap', '[data-goi="bus"]', 250);
      await new Promise(async r => { IF.lap.onload = r; await bam('lap', '[data-tiep]', 0); });
      D('lap').head.insertAdjacentHTML('beforeend', '<style>.dai-mo-phong,#av-dang-xuat{display:none!important}</style>');
      await den(9.6);
      chip(2, 'Vào app, có hướng dẫn chỉ tay');
      await bam('lap', '.tour-the [data-tour="bo"]', 300);
      chip(3, 'Đăng nhu cầu mua');
      await bam('lap', '.chinh a[href$="#tao-nhu-cau"], a[href$="#tao-nhu-cau"]', 900);
      await chon('lap', '#mh', 'Mít Thái', 300);
      await go('lap', '#luong', '3', 300);
      await den(15.5);
      await bam('lap', '#tao-nhu-cau [data-luot="tin"]', 1200);
      const dong = await tim('lap', '#nhu-cau tbody tr.av-nc'); if (dong) { await diTro('lap', dong); dong.style.outline = '3px solid #f5b83d'; }
    },
    async 'nam-dang-hang'() {
      anTro(); chip(0, '');
      datTb('lap', { x: -1600, y: 110, s: 1, hien: false });
      nhan('dt', A + 'mango.jpg', 'Chị Năm', '· Mỹ Xương, Cao Lãnh');
      datTb('dt', { x: 745, y: 130, s: 1 });
      lop(`<div class="vua" style="font-size:44px;color:#fff">Không rành<br>điện thoại?</div>`, { left: '150px', top: '360px' });
      await den(1.2);
      await bam('dt', '#chao-mung .bottom-actions a.link-btn', 500);
      await bam('dt', '#dang-nhap .bottom-actions a.btn', 500);
      await new Promise(async r => { IF.dt.onload = r; await bam('dt', '[data-demo-otp]', 0); });
      D('dt').head.insertAdjacentHTML('beforeend', '<style>.dai-mo-phong{display:none!important}</style>');
      await ngu(900);
      await xoaChu(300);
      lop(`<div class="vua" style="font-size:44px;color:#fff">App chỉ<br><span style="color:var(--nang)">đúng nút cần bấm</span>.</div>`, { left: '150px', top: '360px' });
      await bam('dt', '.tour-the [data-tour-mo="dang"]', 1300);
      await bam('dt', 'nav.nav a.dang', 1300);
      await den(8.2);
      await bam('dt', 'a.nut-noi', 400);
      await xoaChu(300);
