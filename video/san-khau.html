<!doctype html>

<style>

  * { box-sizing: border-box; }

  .nt { display: grid; gap: 22px; width: 1060px; }

  .nt .ic svg { width: 32px; height: 32px; }
  .nt b { font-size: 31px; } .nt span { display: block; font-size: 22px; color: var(--mo); margin-top: 4px; font-weight: 500; }
  .goi { display: flex; gap: 28px; }
  .goi > div { width: 440px; padding: 38px 36px; }
  .goi > div.noi { border: 1.5px solid rgba(245,184,61,.6); box-shadow: 0 0 60px rgba(245,184,61,.12), 0 30px 60px rgba(0,0,0,.35); }
  .goi .loai { font-size: 22px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--mo); }
  .goi strong { display: block; font-size: 64px; margin: 14px 0 10px; letter-spacing: -.02em; }

  .url b { color: #fff; }
  #phu-de { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 60; max-width: 1480px; text-align: center; font-size: 34px; font-weight: 600; line-height: 1.4; padding: 12px 30px; border-radius: 14px; background: rgba(4, 12, 8, .72); color: #fff; opacity: 0; transition: opacity .25s; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  #phu-de.on { opacity: 1; }
  #phu-de.nvn { color: var(--kem); font-style: italic; }
  #man-den { position: absolute; inset: 0; background: #000; z-index: 90; opacity: 1; transition: opacity 1.2s ease; pointer-events: none; }
</style>

<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="ic-gia" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="7.5" r="1.5"/></symbol>
  <symbol id="ic-can" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 21h14M6 7h12M6 7l-3 7a3 3 0 0 0 6 0zM18 7l-3 7a3 3 0 0 0 6 0z"/></symbol>
  <symbol id="ic-tien" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/></symbol>
  <symbol id="ic-khoa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="ic-khien" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>

  <symbol id="ic-chuyen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h14l-3-3M20 17H6l3 3"/></symbol>
</svg>
<div id="san">
  <div class="quang q1"></div><div class="quang q2"></div><div class="quang q3"></div>
  <div id="luoi"></div>
  <canvas id="mang" width="1920" height="1080"></canvas>
  <div class="tb" id="tb-lap"><div class="nhan-tb" id="nhan-lap"></div><div class="man"><span class="cam"></span><iframe id="if-lap" title="App Thu mua"></iframe></div><div class="de"></div></div>
  <div class="tb" id="tb-dt"><div class="nhan-tb" id="nhan-dt"></div><iframe id="if-dt" title="App Nhà sản xuất"></iframe></div>
  <div id="chu"></div>
  <div class="kinh" id="chip" style="opacity:0"></div>

  <div id="toi-vien"></div>
  <div id="phu-de"></div>
  <div id="man-den"></div>
</div>
<script>
(async () => {
  const L = await (await fetch('lich.json')).json();
  const $ = s => document.querySelector(s);
  const ngu = ms => new Promise(r => setTimeout(r, ms));
  const IF = { dt: $('#if-dt'), lap: $('#if-lap') };
  const TB = { dt: $('#tb-dt'), lap: $('#tb-lap') };
  const lech = [];
  // App trong iframe cuộn tới nút / đặt con trỏ vào ô nhập thì trình duyệt cuộn cả sân khấu: giữ yên khung hình
  (function giuYen() { const se = document.scrollingElement, sn = document.getElementById('san'); if (se.scrollTop || se.scrollLeft) se.scrollTo(0, 0); if (sn.scrollTop || sn.scrollLeft) { sn.scrollTop = 0; sn.scrollLeft = 0; } requestAnimationFrame(giuYen); })();
  let T0 = 0, canhBd = 0;
  const bayGio = () => (performance.now() - T0) / 1000;
  const den = async giay => { const con = canhBd + giay - bayGio(); if (con > 0) await ngu(con * 1000); };

  /* ---------- mạng lưới người bán (vàng) – bên mua (xanh) ---------- */
  const mang = (() => {
    const cv = $('#mang'), g = cv.getContext('2d');
    let seed = 11; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const nut = [];
    for (let i = 0; i < 54; i++) { const ban = i % 2 === 0; nut.push({ ban, x: ban ? 120 + r() * 820 : 980 + r() * 820, y: 90 + r() * 900, p: r() * 6.28, sp: .2 + r() * .4 }); }
    const canh = [];
    nut.forEach((a, i) => { if (!a.ban) return; const ds = nut.map((b, j) => ({ j, d: b.ban ? 1e9 : Math.hypot(a.x - b.x, a.y - b.y) })).sort((u, v) => u.d - v.d); canh.push({ a: i, b: ds[0].j, t: r() }); if (r() > .5) canh.push({ a: i, b: ds[1].j, t: r() }); });
    canh.sort((u, v) => u.t - v.t);
    const st = { tien: 0, do: 0, hoi: 0 }, dich = { tien: 0, do: 0, hoi: 0 };
    let tg = performance.now();
    function ve(now) {
      const dt = Math.min(.05, (now - tg) / 1000); tg = now;
      for (const k in st) st[k] += (dich[k] - st[k]) * Math.min(1, dt * 1.6);
      g.clearRect(0, 0, 1920, 1080);
      if (st.do > .01) {
        const cx = 960, cy = 480, t = now / 1000;
        const P = nut.map(n => { const dx = Math.sin(t * n.sp + n.p) * 14, dy = Math.cos(t * n.sp * .8 + n.p) * 12; const g0 = Math.atan2(n.y - 540, n.x - 960) + t * .04, vx = cx + Math.cos(g0) * (700 + dx * 3), vy = cy + 30 + Math.sin(g0) * (400 + dy * 3); return { x: (n.x + dx) * (1 - st.hoi) + vx * st.hoi, y: (n.y + dy) * (1 - st.hoi) + vy * st.hoi }; });
        const so = canh.length * st.tien;
        canh.forEach((c, k) => {
          const p = Math.max(0, Math.min(1, so - k)); if (!p) return;
          const A = P[c.a], B = P[c.b], x = A.x + (B.x - A.x) * p, y = A.y + (B.y - A.y) * p;
          const gr = g.createLinearGradient(A.x, A.y, B.x, B.y); const mo = .45 * st.do * (1 - st.hoi * .9); gr.addColorStop(0, `rgba(245,184,61,${mo})`); gr.addColorStop(1, `rgba(63,181,138,${mo})`);
          g.strokeStyle = gr; g.lineWidth = 1.6; g.beginPath(); g.moveTo(A.x, A.y); g.lineTo(x, y); g.stroke();
          if (p >= 1) { const q = (t * .35 + c.t) % 1; g.fillStyle = `rgba(255,236,190,${.8 * st.do * (1 - st.hoi * .9)})`; g.beginPath(); g.arc(A.x + (B.x - A.x) * q, A.y + (B.y - A.y) * q, 2.4, 0, 6.3); g.fill(); }
        });
        nut.forEach((n, i) => { const { x, y } = P[i]; g.fillStyle = n.ban ? `rgba(245,184,61,${.9 * st.do})` : `rgba(63,181,138,${.9 * st.do})`; g.beginPath(); g.arc(x, y, n.ban ? 5 : 6, 0, 6.3); g.fill(); g.globalAlpha = .18; g.beginPath(); g.arc(x, y, 15, 0, 6.3); g.fill(); g.globalAlpha = 1; });
      }
      requestAnimationFrame(ve);
    }
    requestAnimationFrame(ve);
    return o => Object.assign(dich, o);
  })();

  /* ---------- thiết bị ---------- */
  function datTb(k, { x, y, s = 1, hien = true, nghieng = 0 }) { const t = TB[k]; t.style.left = x + 'px'; t.style.top = y + 'px'; t.style.transform = `scale(${s}) rotateY(${nghieng}deg)`; t.classList.toggle('hien', hien); }
  function nhan(k, chuCai, ten, phu) { $('#nhan-' + k).innerHTML = chuCai ? `<span class="av ${chuCai === 'N' ? 'n' : 't'}">${chuCai}</span>${ten}<small>${phu}</small>` : ''; }
  const W = k => IF[k].contentWindow, D = k => IF[k].contentDocument;
  async function mo(k, url, cho = 900) {
    await new Promise(r => { IF[k].onload = r; IF[k].src = url; });
    D(k).head.insertAdjacentHTML('beforeend', '<style>html{scroll-behavior:smooth}.dai-mo-phong,#av-dang-xuat{display:none!important}</style>');
    await ngu(cho);
  }
  async function tim(k, sel, ms = 5000) {
    const t = performance.now();
    while (performance.now() - t < ms) {
      const el = [...D(k).querySelectorAll(sel)].find(e => e.getClientRects().length && getComputedStyle(e).visibility !== 'hidden');
      if (el) return el;
      await ngu(80);
    }
    lech.push('không thấy ' + k + ' ' + sel + ' @' + bayGio().toFixed(1));
    return null;
  }
  function viTri(k, el) { const fr = IF[k].getBoundingClientRect(), s = fr.width / IF[k].offsetWidth, r = el.getBoundingClientRect(); return { x: fr.left + (r.left + r.width / 2) * s, y: fr.top + (r.top + r.height / 2) * s }; }
  const tro = $('#tro');
  async function diTro(k, el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); await ngu(350); const p = viTri(k, el); tro.style.opacity = 1; tro.style.transform = `translate(${p.x - 6}px, ${p.y - 4}px)`; await ngu(620); return viTri(k, el); }
  function gon(p) { const g = document.createElement('div'); g.className = 'gon'; g.style.left = p.x + 'px'; g.style.top = p.y + 'px'; $('#san').appendChild(g); setTimeout(() => g.remove(), 700); }

      chuDong('Tìm đúng mối, *chốt* *đúng* *giá.*', 'h2', { left: '0', right: '0', top: '500px', textAlign: 'center' }, 90);
      await denCau(2, .9);
      lop(`<div class="kinh url">Dùng thử miễn phí <b>agiviet-23a94.web.app</b></div>`, { left: '0', right: '0', top: '650px', display: 'flex', justifyContent: 'center' });
      await den(L.canh.at(-1).dai - 1.0); $('#man-den').style.opacity = 1;
    },
  };

  window.batDau = async () => {
    T0 = performance.now();
    requestAnimationFrame(vePhuDe);
    for (const c of L.canh) {
      canhBd = c.bat_dau; canhHt = c;
      const tre = bayGio() - c.bat_dau; if (tre > .3) lech.push(`cảnh ${c.id} bắt đầu trễ ${tre.toFixed(2)}s`);
      try { await CANH[c.id](); } catch (e) { lech.push(c.id + ': ' + e.message); }
      await den(c.dai);
    }
    return { lech, tong: bayGio() };
  };
  window.T0 = () => performance.timeOrigin + T0;
  window.sanSang = true;
})();
</script>
