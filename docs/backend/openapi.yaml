            da_nhan_truc_tiep: *id002
            da_tra_truc_tiep_duoc_xac_nhan: *id002
            ngan_hang_da_chuyen_den: *id002
            con_phai_nhan: *id002
            con_phai_tra: *id002
            phi_da_thu_chua_chot: *id002
        theo_don:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              code:
                type: string
              status:
                type: string
              la_mua:
                type: boolean
              coc_trang_thai:
                type:
                - string
                - 'null'
              coc_dang_giu_vnd: *id002
              phi_vnd: *id002
              phi_trang_thai:
                type: string
                enum:
                - chua_thu
                - da_thu_cho_ket_qua
                - khong_hoan
                - theo_bang_hoan
        ghi_chu:
          type: string
    Plan:
      type: object
      properties:
        code:
          type: string
        label_vi:
          type: string
        monthly_price_vnd: *id002
        first_order_fee_bps:
          type: integer
        repeat_fee_bps:
          type: integer
        fee_floor_vnd: *id002
        fee_cap_vnd: *id002
        max_members:
          type: integer
        la_gia_thu:
          type: boolean
        ghi_chu:
          type: string
    Subscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        plan_code:
          type: string
        label_vi:
          type: string
        tu:
          type: string
          format: date-time
        den:
          type: string
          format: date-time
        so_thanh_vien:
          type: integer
        max_members:
          type: integer
    SupportTicket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        status:
          type: string
        trigger_reason:
          type: string
        created_at:
          type: string
          format: date-time
        response_due_at:
          type: string
          format: date-time
        next_update_at:
          type: string
          format: date-time
        nguoi_phu_trach:
          type:
          - string
          - 'null'
    SourceProfile:
      type: object
      properties:
        lot_id:
          type: string
          format: uuid
        lot_code:
          type: string
        nguoi_ban:
          type: object
          properties:
            ten:
              type: string
            loai:
              type: string
            muc_xac_minh:
              type: integer
            tinh:
              type:
              - string
              - 'null'
        vi_tri:
          type:
          - object
          - 'null'
        giay_to:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
              label_vi:
                type: string
              market:
                type:
                - string
                - 'null'
              tu:
                type:
                - string
                - 'null'
              den:
                type:
                - string
                - 'null'
              trang_thai:
                type: string
                enum:
                - da_xac_minh
                - tu_khai
                - het_hieu_luc
        anh:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              nhan:
                type: string
                enum:
                - chup_trong_app
                - anh_tai_len
              captured_at:
                type:
                - string
                - 'null'
        don_hoan_tat_tren_app:
          type: integer
        uy_tin:
          type: 'null'
        ghi_chu_uy_tin:
          type: string
    Amendment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
        payload:
          type: object
        resulting_version_no:
          type:
          - integer
          - 'null'
        created_at:
          type: string
          format: date-time
        la_cua_toi:
          type: boolean
        annex_document_id:
          type:
          - string
          - 'null'
        han:
          type:
          - string
          - 'null'
    Delivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        order_id:
          type: string
          format: uuid
        order_code:
          type: string
        status:
          type: string
        revision:
          type: integer
        batch_no:
          type: integer
        planned_qty_g: *id001
        receiver_user_id:
          type:
          - string
          - 'null'
        acceptance_point:
          type: string
        window_from:
          type: string
          format: date-time
        window_to:
          type: string
          format: date-time
        the_san_sang:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ReadinessLine'
        ket_qua:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              version_no:
                type: integer
              weighed_g: *id001
              document_id:
                type: string
                format: uuid
              content_sha256:
                type: string
              lines:
                type: array
                items:
                  type: object
                  properties:
                    line_no:
                      type: integer
                    kind:
                      type: string
                    qty_g: *id001
                    unit_price_vnd: *id002
                    value_vnd: *id002
                    reason_code:
                      type:
                      - string
                      - 'null'
                    status:
                      type: string
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        kind:
          type: string
        priority:
          type: string
        entity:
          type: string
        entity_id:
          type: string
          format: uuid
        order_id:
          type:
          - string
          - 'null'
        order_code:
          type:
          - string
          - 'null'
        required_role:
          type: string
        trigger_reason:
          type: string
        status:
          type: string
        assigned_to:
          type:
          - string
          - 'null'
        assigned_name:
          type:
          - string
          - 'null'
        response_due_at:
          type: string
          format: date-time
        resolution_due_at:
          type: string
          format: date-time
        next_update_at:
          type: string
          format: date-time
        result_code:
          type:
          - string
          - 'null'
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    CommandUnavailable:
      description: 501 CHUA_HO_TRO. Chưa có command DB phù hợp hoặc command hiện chưa thực hiện an toàn được nhánh này; không có đường dự phòng owner. Xem docs/backend/danh-gia-thanh-that.md.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                      const: CHUA_HO_TRO
                    message:
                      type: string
              request_id:
                type: string
    Cmd:
      description: Kết quả lệnh
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandResult'
    Err:
      description: Lỗi nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
paths:
  /health:
    get:
      tags:
      - ops
      security: []
      summary: Sức khỏe (số migration, giờ hệ thống)
      responses:
        '200':
          description: OK
  /health/ready:
    get:
      tags:
      - ops
      security: []
      summary: Sẵn sàng (truy vấn DB)
      responses:
        '200':
          description: OK
  /v1/auth/otp/send:
    post:
      tags:
      - auth
      security: []
      summary: Gửi OTP đăng nhập (SMS mô phỏng). Môi trường thử trả ma_thu = 123456.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              properties:
                phone:
                  type: string
                  example: 0918000421
      responses:
        '200':
          description: '{challenge_id, het_han_giay, ma_thu?}'
        '429':
          $ref: '#/components/responses/Err'
  /v1/auth/otp/verify:
    post:
      tags:
      - auth
      security: []
      summary: Xác nhận OTP, tạo phiên. org_code để chọn tổ chức khi thuộc nhiều tổ chức.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - challenge_id
              - phone
              - code
              properties:
                challenge_id:
                  type: string
                phone:
                  type: string
                code:
                  type: string
                org_code:
                  type: string
                device_id:
                  type: string
      responses:
        '200':
          description: '{token, user}'
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/Err'
  /v1/auth/session:
    get:
      tags:
      - auth
      summary: Hồ sơ phiên hiện tại (vai, hành động được phép)
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /v1/auth/switch-org:
    post:
      tags:
      - auth
      summary: Đổi tổ chức đang thao tác
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                org_code:
                  type: string
      responses:
        '200':
          description: User
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: Đăng xuất
      responses:
        '200':
          description: OK
  /v1/otp/challenges:
    post:
      tags:
      - auth
      summary: Tạo OTP cho hành động (ký hợp đồng/phụ lục, xác nhận đã nhận tiền). Không cần idempotency_key.
      description: 'Binding do server dựng lại từ DB: ký = mã đơn + mã tài liệu + SHA-256 nội dung + giá trị hợp đồng; nhận tiền = mã khoản + số tiền + phiên bản hợp đồng.

        Người giúp không bao giờ nhận được OTP ký/tiền (KHONG_CO_QUYEN). Mã hết hạn 5 phút, tối đa 5 lần sai.

        '
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - purpose
              properties:
                purpose:
                  type: string
                  enum:
                  - contract_sign
                  - amendment_sign
                  - money_received
                document_id:
                  type: string
                  format: uuid
                payment_id:
                  type: string
                  format: uuid
                amount_vnd:
                  $ref: '#/components/schemas/Int'
      responses:
        '200':
          description: '{challenge_id, purpose, het_han_giay, binding, ma_thu?}'
  /v1/products:
    get:
      tags:
      - catalog
      summary: Danh mục mặt hàng và bảng loại
      responses:
        '200':
          description: OK
  /v1/products/{code}/profile:
    get:
      tags:
      - catalog
      summary: Hồ sơ ngành hàng hiện hành + danh mục lý do trả lại
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /v1/reference-prices:
    get:
      tags:
      - catalog
      summary: Giá tham khảo (≥ 3 đơn từ ≥ 2 cặp), hoặc chua_du_du_lieu
      parameters:
      - name: product
        in: query
        required: true
        schema:
          type: string
      - name: grade
        in: query
        required: true
        schema:
          type: string
      - name: region
        in: query
        schema:
          type: string
      responses:
        '200':
          description: '{status, price_vnd, order_count, pair_count, scope, as_of}'
  /v1/files:
    post:
      tags:
      - documents
      summary: Tải ảnh/chứng từ (base64, ≤ 8 MB). Ảnh chỉ là đầu mối, không phải bằng chứng tiền.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CommandBase'
              - type: object
                required:
                - mime
                - data_base64
                - entity
                - entity_id
                - captured_in_app
                properties:
                  mime:
                    type: string
                    enum:
                    - image/jpeg
                    - image/png
                    - image/webp
                    - application/pdf
                  data_base64:
                    type: string
                  entity:
                    type: string
                    enum:
                    - lot
                    - order
                    - delivery
                    - acceptance
                    - payment
                    - dispute
                    - organization
                    - production_site
                    description: 'organization: chứng cứ xác minh tổ chức (giấy phép, CCCD) - chủ tổ chức đó hoặc nhân viên field/risk/supervisor/support.'
                  entity_id:
                    type: string
                    format: uuid
                  captured_in_app:
                    type: boolean
                  lat:
                    type: number
                  lng:
                    type: number
      responses:
        '200':
          $ref: '#/components/responses/Cmd'
  /v1/lots:
    get:
      tags:
      - lots
      summary: 'mine=true: lô của tôi (có khả dụng). Không mine: tìm nguồn cho bên mua (KHÔNG có giá).'
      parameters:
      - name: mine
        in: query
        schema:
          type: string
          enum:
          - 'true'
      - name: product
        in: query
        schema:
          type: string
      - name: grade
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LotListItem'
      description: Tìm nguồn ẩn lô quá 14 ngày (CHINH_SACH.han.hienThiLoNgay) chưa xác nhận còn hàng. mine=true trả thêm last_confirmed_at, an_tu_dong, an_ly_do; POST /v1/lots/{id}/confirm-available để
        hiện lại.
    post:
      tags:
      - lots
      summary: 'tao_lo: tạo lô nháp (NB, người giúp lot.draft). Chặn ngày hái trước hết cách ly (CHUA_HET_CACH_LY). Trả cảnh báo giá.'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CommandBase'
              - type: object
                required:
                - product_code
                - grade_code
                - qty_basis
                - qty_g
                - ask_price_vnd
                - floor_price_vnd
                properties:
                  product_code:
                    type: string
                  grade_code:
                    type: string
                  qty_basis:
                    type: string
                    enum:
                    - estimated
                    - weighed
                  qty_g:
                    $ref: '#/components/schemas/Int'
                  available_from:
                    type: string
                    format: date
                  harvest_on:
                    type: string
                    format: date
                  spray_clear_on:
                    type: string
                    format: date
                  site_id:
                    type: string
                    format: uuid
                  ask_price_vnd:
                    $ref: '#/components/schemas/Int'
                  floor_price_vnd:
                    $ref: '#/components/schemas/Int'
                    description: 'Giá thấp nhất KÍN: chỉ chủ lô thấy'
                  variety:
                    type: string
      responses:
        '501':
          $ref: '#/components/responses/CommandUnavailable'
        '200':
          $ref: '#/components/responses/Cmd'
        '422':
          description: MAT_HANG_CHUA_XAC_MINH khi tổ chức × vườn × mặt hàng × loại chưa có hồ sơ xác minh hiệu lực; CHUA_HET_CACH_LY theo nhật ký
  /v1/lots/{id}:
    get:
      tags:
      - lots
      summary: Xem lô; chủ lô thấy ask/floor price, bên khác không
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lot'
  /v1/lots/{id}/qty:
    get:
      tags:
      - lots
      summary: Sổ lượng theo ngăn (available, held, committed, in_transit, delivered, returned_pending, moved_to_child, loss), gam
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotQty'
  /v1/lots/{id}/publish:
    post:
      tags:
      - lots
      summary: 'dang_lo: cần ≥ 1 ảnh chụp trong app; sang on_sale hoặc upcoming'
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandBase'
      responses:
        '200':
          $ref: '#/components/responses/Cmd'
  /v1/lots/{id}/confirm-available:
    post:
      tags:
      - lots
      summary: xac_nhan_con_hang
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/Cmd'
  /v1/lots/{id}/price:
    post:
      tags:
      - lots
      summary: 'sua_gia (1 lần / 24 giờ trừ bán gấp): {ask_price_vnd, floor_price_vnd}'
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/Cmd'
  /v1/lots/{id}/close:
    post:
      tags:
      - lots
      summary: dong_lo (không còn giữ/cam kết)
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/Cmd'
  /v1/demands:
    get:
      tags:
      - demands
      summary: 'mine=true: phiếu của tôi; không mine: phiếu đang mở cho người bán (không giá tối đa)'
      responses:
        '200':
          description: OK
    post:
      tags:
      - demands
      summary: tao_nhu_cau (BM mua hàng/quản lý; tổ chức có MST)
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CommandBase'
              - type: object
                required:
                - product_code
                - segment_code
                - needed_from
                - needed_to
                - delivery_mode
                - lines
                properties:
                  product_code:
                    type: string
                  segment_code:
                    type: string
                    enum:
                    - export
                    - processor
                    - horeca
                    - wholesaler
                  needed_from:
                    type: string
                    format: date
                  needed_to:
                    type: string
                    format: date
                  delivery_mode:
                    type: string
                    enum:
                    - self_pickup
                    - delivered
                  required_docs:
                    type: array
                    items:
                      type: string
                  lines:
                    type: array
                    items:
                      type: object
                      required:
                      - grade_code
                      - qty_g
                      - max_price_vnd
                      - min_source_qty_g
                      properties:
                        grade_code:
                          type: string
                        qty_g:
                          type: string
                          pattern: ^[1-9][0-9]*$
                          description: Số nguyên dương (chuỗi thập phân). Thiếu hoặc 0 trả 422 DU_LIEU_KHONG_HOP_LE.
                        max_price_vnd:
                          type: string
                          pattern: ^[1-9][0-9]*$
                          description: KÍN. Số nguyên dương, đồng/kg.
                        min_source_qty_g:
                          type: string
                          pattern: ^[1-9][0-9]*$
                          description: Lượng tối thiểu mỗi nguồn (gam), bắt buộc, >0 và không lớn hơn qty_g. Thiếu/0 trả 422.
                      minItems: 1
      responses:
        '200':
          $ref: '#/components/responses/Cmd'
        '422':
          description: Thiếu trường hoặc sai giá trị dòng nhu cầu (DU_LIEU_KHONG_HOP_LE, có hướng sửa).
  /v1/demands/{id}:
    get:
      tags:
      - demands
      summary: Xem phiếu (chủ phiếu thấy max_price_vnd)
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Demand'
  /v1/demands/{id}/publish:
    post:
      tags:
      - demands
      summary: dang_nhu_cau
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/Cmd'
  /v1/demands/{id}/lines/{lineId}/max-price:
    post:
      tags:
      - demands
      summary: 'sua_nhu_cau: giá tối đa chỉ tăng (GIA_KHONG_DUOC_GIAM)'
      parameters:
      - $ref: '#/components/parameters/id'
      - name: lineId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Cmd'
  /v1/demands/{id}/close:
    post:
      tags:
      - demands
      summary: dong_nhu_cau (lời chào đang mở hết hiệu lực)
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/Cmd'
  /v1/demands/{id}/matches:
    get:
      tags:
      - demands
      summary: Kết quả ghép 3 nhóm (khop_du, khop_mot_phan, gan_khop_gia) + gợi ý gom; không số giá; xếp theo điểm
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matches'
  /v1/offers:
    get:
      tags:
      - offers
      summary: Lời chào của tổ chức tôi (vòng cuối)
      responses:
        '200':
          description: OK
    post:
      tags:
      - offers
      summary: 'gui_loi_chao: buyer_bid (bên mua chào lô) hoặc seller_quote (người bán báo giá cho dòng nhu cầu)'
