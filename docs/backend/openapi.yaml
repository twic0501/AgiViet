openapi: 3.1.0
info:
  title: AgiViet production v2 · Backend API
  version: 0.1.1
  description: "API dùng chung cho app bán và app mua. Tiếng Việt cho câu lỗi; tên API tiếng Anh.\n\nQuy ước:\n- Tiền là số nguyên đồng, lượng là số nguyên GAM. Trong phản hồi, mọi trường `*_vnd`, `*_g`\
    \ là CHUỖI chữ số\n  (tránh mất chính xác số lớn). Đầu vào nhận số nguyên hoặc chuỗi chữ số.\n- Thời gian ISO 8601 UTC (hiển thị giờ Việt Nam ở giao diện).\n- Lệnh (POST đổi dữ liệu) bắt buộc `idempotency_key`\
    \ (8–128 ký tự, client tự sinh, giữ nguyên khi gửi lại).\n  Gửi lại cùng khóa + cùng thân trả đúng kết quả cũ (`replayed: true`); cùng khóa khác thân → 409 `IDEMPOTENCY_XUNG_DOT`.\n  Có thể kèm `expected_revision`\
    \ (số `revision` đã đọc); lệch → 409 `REVISION_XUNG_DOT`.\n- Phản hồi lệnh: `{id, revision, status, events[], errors[], data}`. Lỗi: `{errors:[{code,message,fix,details}], request_id}`.\n- Mọi phản\
    \ hồi có header `x-request-id` (gửi kèm khi bấm \"Cần hỗ trợ\").\n- Xác thực: `Authorization: Bearer <token>` lấy từ `/v1/auth/otp/verify`. Header tùy chọn `x-device-id`.\n- Đường dẫn `/v1/test/*` và\
    \ `/v1/sim/*` CHỈ có ở môi trường thử (production trả 404 `CHI_MOI_TRUONG_THU`).\n"
servers:
- url: http://127.0.0.1:8080
security:
- bearer: []
