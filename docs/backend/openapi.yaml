- name: webhooks
  description: Webhook đối tác
- name: test
  description: Chỉ môi trường thử
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Int:
      oneOf:
      - type: integer
        minimum: 0
      - type: string
        pattern: ^\d{1,15}$
    Money:
      type: string
      pattern: ^-?\d+$
      description: Số nguyên đồng dạng chuỗi
    Grams:
      type: string
      pattern: ^\d+$
      description: Số nguyên gam dạng chuỗi
    CommandBase:
      type: object
      required:
      - idempotency_key
      properties:
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
        expected_revision:
          type: integer
    CommandResult:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        revision:
          type:
          - integer
          - 'null'
        status:
          type:
          - string
          - 'null'
        events:
          type: array
          items:
            type: string
          description: Sự kiện nghiệp vụ phát trong giao dịch (03 mục 15), ví dụ don.ben_mua_ky
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        data:
          type: object
          description: Kết quả chi tiết của lệnh
        replayed:
          type: boolean
    Error:
      type: object
      properties:
        code:
          type: string
          description: Mã ổn định (12 mục A8), ví dụ KHONG_CO_QUYEN, OTP_SAI, CHUA_DU_TIEN_TRUOC_BOC
        message:
          type: string
          description: Câu tiếng Việt cho người dùng
