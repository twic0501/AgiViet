<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hàng hóa · AgiViet bán (bản mẫu)</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="./so-vuon.css">
<style>
  /* Hai ngăn */
  /* Dải ngăn dính dưới header, có nền đệm để không sát header và che nội dung cuộn bên dưới */
  .dai-ngan { position: sticky; top: calc(66px + env(safe-area-inset-top)); z-index: 4; margin: -14px -16px 0; padding: 12px 16px 10px; background: var(--giay); box-shadow: 0 6px 10px -8px rgba(31, 77, 58, .25); }
  .ngan { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--giay-lot); border-radius: 14px; padding: 4px; }
  .ngan button { min-height: 44px; border: 0; border-radius: 10px; background: transparent; font: 600 14px/1.15 var(--chu); padding: 0 4px; color: var(--muc-phu); cursor: pointer; }
  .ngan button[aria-selected="true"] { background: var(--giay-noi); color: var(--la-dam); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px var(--ke); }
  .ngan small { font-size: 12px; font-weight: 700; margin-left: 4px; color: var(--la); }
  /* Tóm tắt */
  .tong-quan { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tong-quan > * { background: var(--giay-noi); border: 1px solid var(--ke); border-radius: 14px; padding: 12px; text-decoration: none; color: inherit; }
  .tong-quan b { display: block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tong-quan span { font-size: 13px; color: var(--muc-nhat); }
  /* Nhắc việc của chợ */
  .nhac { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--chin-nen); color: var(--muc); }
  .nhac p { font-size: 14px; line-height: 1.4; }
  .nhac p b { font-weight: 700; }
  .nhac button, .lo .xac-nhan { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--la); color: var(--tren-la); font: 600 14px/1 var(--chu); cursor: pointer; white-space: nowrap; }
  /* Lọc */
  .loc { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .loc::-webkit-scrollbar { display: none; }
  .loc button { flex: none; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--ke-dam); background: var(--giay-noi); color: var(--muc-phu); font: 600 14px/1 var(--chu); cursor: pointer; }
  .loc button[aria-pressed="true"] { background: var(--la); color: var(--tren-la); border-color: var(--la); }
  .loc button small { font-weight: 400; opacity: .75; margin-left: 4px; }
  /* Thẻ lô */
  .lo { display: block; padding: 12px; border-radius: 16px; background: var(--giay-noi); border: 1px solid var(--ke); color: inherit; }
  .lo + .lo { margin-top: 12px; }
  .lo .dau-lo { display: grid; grid-template-columns: 64px 1fr 14px; gap: 12px; align-items: center; text-decoration: none; color: inherit; }
  .lo .mui-ct, .the-nc .mui-ct { color: var(--muc-nhat); font-size: 20px; }
  .lo .loai { font-size: 14px; font-weight: 600; color: var(--muc-phu); margin-top: 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lo .anh { width: 64px; height: 64px; border-radius: 12px; background: var(--giay-lot) center / cover no-repeat; }
  .lo .ten { font-weight: 600; font-size: 16px; }
  .lo .phu { font-size: 13px; color: var(--muc-nhat); margin-top: 2px; }
  .lo .tt { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--la-nhat); color: var(--la-dam); white-space: nowrap; }
  .lo .tt.cho { background: var(--cho-nen); color: var(--cho); }
  .lo .tt.gap { background: var(--dau-do-nen); color: var(--dau-do); }
  .lo .tt.vang { background: var(--chin-nen); color: var(--chin); }
  .luong { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--ke); margin-top: 12px; }
  .luong i { display: block; height: 100%; }
  .luong .con { background: var(--la); } .luong .giu { background: #e2b24a; } .luong .hua { background: #4f7fb8; } .luong .giao { background: #9aa59f; }
  .chu-luong { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 12.5px; color: var(--muc-phu); }
  .chu-luong span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; background: var(--c); }
  .chu-luong b { color: var(--muc); font-weight: 700; }
  .lo .duoi { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
  .lo .hoi { font-size: 13px; color: var(--muc-phu); }
  .lo .hoi b { color: var(--la-dam); }
  .lo .xac-nhan { min-height: 44px; padding: 0 12px; font-size: 13px; background: var(--giay-noi); color: var(--la-dam); box-shadow: inset 0 0 0 1.5px var(--la); }
  .lo .goi-y { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--dau-do-nen); color: var(--dau-do); font-size: 13px; line-height: 1.4; }
  /* Lời chào trên lô */
  .chao-lo { display: grid; gap: 6px; margin-top: 10px; }
  .chao-lo a { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--giay-lot); text-decoration: none; color: inherit; font-size: 13px; }
  .chao-lo .ai { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chao-lo .gia { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .chao-lo .phu2 { color: var(--muc-nhat); }
  .chao-lo .luot { justify-self: end; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--cho-nen); color: var(--cho); }
  .chao-lo .luot.bac { background: var(--dau-do-nen); color: var(--dau-do); }
  .lo .nut-hang { display: flex; gap: 8px; }
  .lo .nut-ql { min-height: 44px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--la-nhat); color: var(--la-dam); font: 600 13px/1 var(--chu); cursor: pointer; }
  /* Tấm quản lý lô */
  .tam .muc-tam { display: grid; gap: 10px; padding: 12px; border-radius: 14px; background: var(--giay-noi); border: 1px solid var(--ke); }
  .tam .muc-tam h3 { font-size: 15px; }
  .tam .muc-tam p { font-size: 13px; color: var(--muc-nhat); line-height: 1.4; }
  .tam .hai-o { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tam .nut-do { background: var(--dau-do-nen); color: var(--dau-do); box-shadow: none; }
  /* Tấm nổi: không bao giờ rộng hơn màn hình; cuộn dọc khi dài, ẩn thanh cuộn */
  .tam { max-height: 88vh; overflow-y: auto; overflow-x: hidden; grid-template-columns: minmax(0, 1fr); scrollbar-width: none; overscroll-behavior: contain; }
  .tam::-webkit-scrollbar { display: none; }
  .tam label, .tam .muc-tam, .tam .hai-o > * { min-width: 0; }
  .tam input, .tam select { width: 100%; min-width: 0; box-sizing: border-box; }
  /* Cung cầu trong vùng */
  .cung-cau { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .cung-cau > div { padding: 10px 12px; border-radius: 14px; background: var(--giay-noi); border: 1px solid var(--ke); }
  .cung-cau b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .cung-cau span { font-size: 12.5px; color: var(--muc-nhat); }
  .the-nc .sp-nc { font-size: 15px; font-weight: 700; margin-top: 2px; }
  .the-nc .sp-nc span { font-weight: 500; color: var(--muc-phu); font-size: 14px; }
  .the-nc .khop { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--la-nhat); color: var(--la-dam); white-space: nowrap; }
  .the-nc .dong { border-bottom: 0; }
  .the-nc .dong:last-child { padding-bottom: 0; }
  .the-nc .tt-dong { font-size: 13px; font-weight: 600; color: var(--muc-nhat); text-align: right; max-width: 120px; line-height: 1.3; }
  .the-nc .tt-dong.da { color: var(--la-dam); }
  .the-nc .dau-nc { display: grid; grid-template-columns: 1fr 14px; gap: 8px; align-items: center; text-decoration: none; color: inherit; }
  .the-nc .nhan-nc { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .the-nc .nhan-nc:empty { display: none; }
  .the-nc .gom { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--vang-lua-nhat); color: var(--nau-dat); }
  /* Mùa vụ */
  .vu { display: block; padding: 14px; border-radius: 16px; background: var(--giay-noi); border: 1px solid var(--ke); text-decoration: none; color: inherit; }
  .vu + .vu { margin-top: 12px; }
  .vu .loai-hd { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--la-nhat); color: var(--la-dam); }
  .vu .loai-hd.bt { background: var(--vang-lua-nhat); color: var(--nau-dat); }
  .vu .ben { font-weight: 600; margin-top: 8px; }
  .vu .phu { font-size: 13px; color: var(--muc-nhat); margin-top: 2px; }
  .vu dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--ke-dam); font-size: 14px; }
  .vu dt { color: var(--muc-phu); }
  .vu dd { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .vu .tt-vu { margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--la-dam); }
  .nc-khac { margin-top: 16px; }
  .nc-khac summary { min-height: 44px; display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--muc-phu); cursor: pointer; list-style: none; }
  .nc-khac summary::before { content: "›"; display: inline-block; transition: transform 200ms; font-size: 20px; }
  .nc-khac[open] summary::before { transform: rotate(90deg); }
  .nc-khac summary small { font-weight: 700; color: var(--la); }
  .nc-khac .the-nc { margin-top: 12px; }
  .tieu-nho { font-size: 13px; font-weight: 600; color: var(--muc-phu); margin: 18px 0 8px; }
  /* Bên mua đang cần */
  .the-nc { display: block; padding: 14px; border-radius: 16px; background: var(--giay-noi); border: 1px solid var(--ke); }
  .the-nc + .the-nc { margin-top: 12px; }
  .the-nc .tren { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
  .the-nc .ben { font-weight: 600; }
  .the-nc .phu { font-size: 13px; color: var(--muc-nhat); margin-top: 2px; }
  .the-nc .dong { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0 0; margin-top: 10px; border-top: 1px dashed var(--ke-dam); }
  .the-nc .dong .sl { font-weight: 600; font-variant-numeric: tabular-nums; }
  .the-nc .dong button { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--la); color: var(--tren-la); font: 600 14px/1 var(--chu); cursor: pointer; }
  .the-nc .dong button:disabled { background: var(--ke); color: var(--muc-nhat); cursor: default; }
  .trong { text-align: center; padding: 28px 16px; color: var(--muc-phu); }
  /* Tấm chào hàng */
  /* Khi mở tấm: lớp phủ trên cùng, ẩn nút cuộn nhanh và thanh menu */
  body:has(.man-che) .nut-cuon, body:has(.man-che) .tab { visibility: hidden; }
  .tam input:disabled, .tam button:disabled { opacity: .45; cursor: not-allowed; }
  .man-che { position: fixed; inset: 0; background: rgba(20, 30, 25, .45); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
  .tam { width: 100%; max-width: 480px; background: var(--giay); border-radius: 22px 22px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); display: grid; gap: 12px; animation: len 260ms cubic-bezier(.2,.8,.2,1); }
  @keyframes len { from { transform: translateY(100%); } }
  .tam h2 { font-size: 18px; }
  .tam label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; color: var(--muc-phu); }
  .tam select, .tam input { min-height: 48px; border-radius: 12px; border: 1.5px solid var(--ke-dam); background: var(--giay-noi); padding: 0 12px; font: 500 16px/1 var(--chu); color: var(--muc); }
  .tam .goi-y-gia { display: block; font-size: 13px; color: var(--muc-nhat); font-weight: 400; }
  .tam .thanh-tien { padding: 10px 12px; border-radius: 12px; background: var(--vang-lua-nhat); color: #4a3510; font-size: 14px; }
  .tam .thanh-tien:empty { display: none; }
  .tam .thanh-tien b { font-size: 17px; }
  .tam .thanh-tien small { display: block; font-size: 12.5px; opacity: .8; }
  .tam .hang-nut { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
  .tam .bao-ket { font-size: 14px; }
</style>
</head>
<body>
<div class="trang">
  <header class="dau" id="dau"></header>

  <main class="noi" id="noi" aria-busy="true" style="gap:14px">
    <div class="dai-ngan"><div class="ngan" role="tablist" aria-label="Chợ">
      <button type="button" role="tab" id="ngan-hang" aria-selected="true" aria-controls="p-hang">Hàng của tôi</button>
      <button type="button" role="tab" id="ngan-can" aria-selected="false" aria-controls="p-can">Bên mua cần<small id="so-can"></small></button>
      <button type="button" role="tab" id="ngan-vu" aria-selected="false" aria-controls="p-vu">Mùa vụ<small id="so-vu"></small></button></div>
    </div>

    <section id="p-hang" role="tabpanel" aria-labelledby="ngan-hang" style="display:grid;gap:14px">
      <div class="tong-quan">
        <div><b id="so-lo">—</b><span>lô đang bán</span></div>
        <div><b id="tong-con">—</b><span id="dv-con">còn bán</span></div>
        <a href="./ban-tin-nhan.html"><b id="so-chao">—</b><span>lời chào mở</span></a>
      </div>
      <div class="nhac" id="nhac" hidden></div>
      <div class="loc" role="group" aria-label="Lọc theo trạng thái" id="loc"></div>
      <div id="ds"><div class="khung-tai"></div><div class="khung-tai"></div></div>
    </section>

    <section id="p-vu" role="tabpanel" aria-labelledby="ngan-vu" hidden>
      <p class="phu" style="color:var(--muc-nhat);font-size:14px;margin-bottom:10px">Hợp đồng ký trước mùa: <b style="color:var(--muc)">đặt trước khi hái</b> (chốt lượng gần ngày hái) và <b style="color:var(--muc)">bao tiêu theo vụ</b> (bên mua cam kết mua cả vụ, có thể ứng vật tư).</p>
      <div id="ds-vu"><div class="khung-tai"></div></div>
    </section>

    <section id="p-can" role="tabpanel" aria-labelledby="ngan-can" hidden>
      <p class="phu" style="color:var(--muc-nhat);font-size:14px;margin-bottom:10px">Bên mua đăng nhu cầu, bác chọn lô của mình để chào hàng. Giá thấp nhất của bác luôn được giữ kín.</p>
      <div class="cung-cau" id="cung-cau" hidden></div>
      <div id="ds-can"><div class="khung-tai"></div></div>
      <div id="khoi-da-chao" hidden><p class="tieu-nho">Lời chào bác đã gửi</p><div class="chao-lo" id="ds-da-chao"></div></div>
    </section>
  </main>
</div>

<script type="module">
import { can, esc, phien, ANH_SP, giuThamSo, veDau, veTab, tenLoai } from "./chung.js";
const $ = (id) => document.getElementById(id);
giuThamSo();
veTab("cho");
veDau($("dau"), { chao: "Chợ của bác", ten: "Hàng đang bán", chuDau: "" });

const TT = {
  on_sale: ["Đang bán", ""], draft: ["Nháp", "cho"], reserved: ["Đang giữ cho đơn", "vang"],
  sold_out: ["Đã bán hết", "cho"], closed: ["Đã đóng", "cho"], paused: ["Tạm ngưng", "cho"],
};
const NHOM_MUA = { processor: "Nhà máy chế biến", export: "Xuất khẩu", horeca: "Nhà hàng, bếp ăn", wholesale: "Đầu mối", wholesaler: "Vựa, đầu mối", trader: "Thương lái", retail: "Bán lẻ", household: "Hộ chế biến" };
const NGAY_NHAC = 7;   // lô chưa xác nhận còn hàng quá 7 ngày thì nhắc (14 ngày tự ẩn)
const ngayVN = (s) => new Date(s).toLocaleDateString("vi-VN", { day: "numeric", month: "numeric" });

let token, lo = [], tenSp = new Map(), dsChaoMo = [];
const get = (d) => fetch(d, { headers: { authorization: "Bearer " + token } }).then((r) => (r.ok ? r.json() : Promise.reject(new Error(`${d}: ${r.status}`))));
const lenh = async (d, b) => {
  const r = await fetch(d, { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + token }, body: JSON.stringify({ idempotency_key: crypto.randomUUID(), ...b }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const e = j.errors?.[0] || {};
    if (/ck_lot_price_rate/.test(JSON.stringify(e))) throw new Error("Giá lô chỉ sửa được 1 lần mỗi 24 giờ. Bác đợi qua 24 giờ rồi sửa lại.");
    if (e.details?.db === "uq_offer_open_per_lot_buyer") throw new Error("Lô này đã có lời chào đang mở với bên mua này. Bác xem và trả lời ở Tin nhắn.");
    throw new Error(e.message || j.thong_diep || j.message || `Lỗi ${r.status}`);
  }
  return j;
};

// Hai ngăn
const chonNgan = (k) => {
  for (const [n, p] of [["ngan-hang", "p-hang"], ["ngan-can", "p-can"], ["ngan-vu", "p-vu"]]) { const on = n === k; $(n).setAttribute("aria-selected", String(on)); $(p).hidden = !on; $(p).style.display = on ? "grid" : ""; }
  try { sessionStorage.setItem("agv-ngan-cho", k); } catch {}
};
$("ngan-hang").onclick = () => chonNgan("ngan-hang");
$("ngan-can").onclick = () => chonNgan("ngan-can");
$("ngan-vu").onclick = () => chonNgan("ngan-vu");
if (location.hash === "#can") chonNgan("ngan-can"); else if (location.hash === "#vu") chonNgan("ngan-vu");
else { try { const k = sessionStorage.getItem("agv-ngan-cho"); if (k === "ngan-can" || k === "ngan-vu") chonNgan(k); } catch {} }

// Một dòng lời chào: ai chào, giá, lượng, tới lượt ai, hạn → bấm mở Tin nhắn để trả lời
const dongChao = (c, coMaLo = true) => {
  const v = c.vong_cuoi || {};
  const bacChao = c.direction === "seller_quote";
  const toiBac = v.from_side === "buyer";
  const han = v.expires_at ? new Date(v.expires_at).toLocaleString("vi-VN", { hour: "2-digit", minute: "2-digit", day: "numeric", month: "numeric" }) : "";
  return `<a href="./ban-tin-nhan.html${location.search}">
    <span class="ai">${bacChao ? `Bác chào ${esc(c.buyer_name || "bên mua")}` : `${esc(c.buyer_name || "Bên mua")} chào`}</span>
    <span class="gia">${Number(v.price_vnd || 0).toLocaleString("vi-VN")} đ/kg</span>
    <span class="phu2">${esc(can(v.qty_g).join(" "))}${coMaLo ? ` · lô ${esc(c.lot_code)}` : ""}${han ? ` · hạn ${han}` : ""}</span>
    <span class="luot ${toiBac ? "bac" : ""}">${toiBac ? "Chờ bác" : "Chờ bên mua"}</span></a>`;
};

// Quản lý lô: sửa giá (1 lần/24 giờ), bán nhanh 3 ngày, ngừng bán
async function moQuanLy(l) {
  const che = document.createElement("div"); che.className = "man-che";
  const ten = `${tenSp.get(l.product_code) || l.product_code} · ${tenLoai(l.grade_code)}`;
  che.innerHTML = `<div class="tam" role="dialog" aria-modal="true" aria-labelledby="ql-t"><h2 id="ql-t">${esc(ten)} · ${esc(l.code)}</h2><div class="khung-tai"></div></div>`;
  document.body.appendChild(che);
  const dong_ = () => che.remove();
  che.addEventListener("pointerdown", (e) => { if (e.target === che) dong_(); });
  const ct = await get(`/v1/lots/${l.id}`).catch(() => null);
  const g = await get(`/v1/reference-prices?product=${encodeURIComponent(l.product_code)}&grade=${encodeURIComponent(l.grade_code)}`).catch(() => null);
  const tam = che.querySelector(".tam");
  const dangGap = l.ban_gap_den && new Date(l.ban_gap_den) > new Date();
  tam.innerHTML = `<h2 id="ql-t">${esc(ten)} · ${esc(l.code)}</h2>
    <form class="muc-tam" id="f-gia"><h3>Sửa giá</h3>
      <p>Sửa được 1 lần mỗi 24 giờ. Giá thấp nhất giữ kín, bên mua không thấy; lời chào thấp hơn bị tự từ chối.${g?.price_vnd ? ` Giá tham khảo hiện ${Number(g.price_vnd).toLocaleString("vi-VN")} đ/kg.` : ""}</p>
      <div class="hai-o"><label>Giá mong muốn (đ/kg)<input name="ask" type="number" inputmode="numeric" min="1000" step="100" required value="${esc(ct?.ask_price_vnd || "")}"></label>
        <label>Giá thấp nhất (đ/kg)<input name="floor" type="number" inputmode="numeric" min="1000" step="100" required value="${esc(ct?.floor_price_vnd || "")}"></label></div>
      <p class="bao-ket" id="bao-gia" role="status"></p>
      <button type="submit" class="nut chinh-nut">Lưu giá mới</button></form>
    <div class="muc-tam"><h3>Bán nhanh trong 3 ngày</h3>
      <p>${dangGap ? `Đang bán nhanh tới ${new Date(l.ban_gap_den).toLocaleString("vi-VN", { hour: "2-digit", minute: "2-digit", day: "numeric", month: "numeric" })}.` : "Bên mua chỉ thấy \"giao được trong 48 giờ\", không thấy chữ gấp. Bên nhận hàng kém loại sẽ được báo."}</p>
      <p class="bao-ket" id="bao-gap" role="status"></p>
      <button type="button" class="nut phu-nut" id="nut-gap">${dangGap ? "Tắt bán nhanh" : "Bật bán nhanh 3 ngày"}</button></div>
    <div class="muc-tam"><h3>Ngừng bán lô này</h3>
      <p>Bên mua sẽ không thấy lô nữa. Lời chào đang mở và hợp đồng đã ký không bị ảnh hưởng.</p>
      <p class="bao-ket" id="bao-dong" role="status"></p>
      <button type="button" class="nut nut-do" id="nut-dong">Ngừng bán</button></div>
    <button type="button" class="nut phu-nut" id="ql-dong">Đóng</button>`;
  tam.querySelector("#ql-dong").onclick = dong_;
  const f = tam.querySelector("#f-gia");
  // Chưa đủ 24 giờ từ lần sửa trước: khóa sẵn, ghi rõ giờ được sửa lại (không để bác bấm rồi mới báo lỗi)
  const suaTu = ct?.price_editable_from ? new Date(ct.price_editable_from) : null;
  if (suaTu && suaTu > new Date()) {
    f.querySelectorAll("input, button").forEach((x) => (x.disabled = true));
    $("bao-gia").textContent = `Giá vừa được sửa. Bác sửa lại được từ ${suaTu.toLocaleString("vi-VN", { hour: "2-digit", minute: "2-digit", day: "numeric", month: "numeric" })}.`;
  }
  f.onsubmit = async (e) => {
    e.preventDefault();
    if (Number(f.floor.value) > Number(f.ask.value)) { $("bao-gia").textContent = "Giá thấp nhất không được cao hơn giá mong muốn."; return; }
    $("bao-gia").textContent = "Đang lưu…";
    try {
      const r = await lenh(`/v1/lots/${l.id}/price`, { ask_price_vnd: String(f.ask.value), floor_price_vnd: String(f.floor.value) });
      $("bao-gia").textContent = "Đã lưu giá mới." + (r.canh_bao ? ` Lưu ý: ${typeof r.canh_bao === "string" ? r.canh_bao : "giá thấp so với giá tham khảo."}` : "");
    } catch (err) { $("bao-gia").textContent = err.message; }
  };
  tam.querySelector("#nut-gap").onclick = async (e) => {
    e.target.disabled = true; $("bao-gap").textContent = "Đang gửi…";
    try {
      await lenh(`/v1/lots/${l.id}/urgent-sale`, dangGap ? { on: false } : { until: new Date(Date.now() + 3 * 864e5).toISOString(), reason: "Người bán bật bán nhanh trên Chợ" });
      $("bao-gap").textContent = dangGap ? "Đã tắt bán nhanh." : "Đã bật bán nhanh 3 ngày."; setTimeout(() => location.reload(), 900);
    } catch (err) { $("bao-gap").textContent = err.message; e.target.disabled = false; }
  };
  // Ngừng bán cần bấm hai lần (không dùng hộp thoại trình duyệt)
  let xacNhan = false;
  tam.querySelector("#nut-dong").onclick = async (e) => {
    if (!xacNhan) { xacNhan = true; e.target.textContent = "Bấm lần nữa để ngừng bán"; $("bao-dong").textContent = "Bác chắc chắn ngừng bán lô này?"; return; }
    e.target.disabled = true; $("bao-dong").textContent = "Đang gửi…";
    try { await lenh(`/v1/lots/${l.id}/close`, {}); $("bao-dong").textContent = "Đã ngừng bán."; setTimeout(() => location.reload(), 900); }
    catch (err) { $("bao-dong").textContent = err.message; e.target.disabled = false; }
  };
}

async function moHang() {
  const [me, ds, sp, chao] = await Promise.all([get("/v1/me"), get("/v1/lots?mine=true"), get("/v1/products").catch(() => []), get("/v1/offers").catch(() => null)]);
  lo = ds;
  tenSp = new Map((Array.isArray(sp) ? sp : sp.items || []).map((p) => [p.code, p.name_vi || p.name]));
  veDau($("dau"), { chao: "Chợ của bác", ten: me.org.name, chuDau: me.name.split(" ").at(-1).charAt(0).toUpperCase() });

  const dangBan = lo.filter((l) => l.status === "on_sale" && !l.an_tu_dong);
  const [tc, dv] = can(dangBan.reduce((s, l) => s + Number(l.available_g || 0), 0));
  $("so-lo").textContent = dangBan.length; $("tong-con").textContent = tc; $("dv-con").textContent = `${dv} còn bán`;
  const dsChao = chao === null ? null : (Array.isArray(chao) ? chao : chao.items || []).filter((c) => /sent|countered|open|pending/.test(c.status || ""));
  $("so-chao").textContent = dsChao === null ? "—" : dsChao.length;
  dsChaoMo = dsChao || [];
  const hoiTheoLo = new Map(); (dsChao || []).forEach((c) => hoiTheoLo.set(c.lot_code, (hoiTheoLo.get(c.lot_code) || 0) + 1));

  // Lượng theo từng ngăn: còn bán · đang giữ (đồng ý giá, chờ ký) · đã hứa (trong hợp đồng) · đã giao
  const qty = new Map(await Promise.all(lo.map((l) => get(`/v1/lots/${l.id}/qty`).then((q) => [l.id, q]).catch(() => [l.id, null]))));

  // Nhắc: lô sắp tự ẩn / đã ẩn → một nút xác nhận còn hàng cho tất cả
  const canNhac = lo.filter((l) => l.status === "on_sale" && (l.an_tu_dong || !l.last_confirmed_at || (Date.now() - new Date(l.last_confirmed_at)) / 864e5 > NGAY_NHAC));
  if (canNhac.length) {
    $("nhac").innerHTML = `<p><b>${canNhac.length} lô</b> lâu chưa xác nhận còn hàng. Quá 14 ngày bên mua sẽ không thấy nữa.</p><button type="button" id="xn-tat-ca">Vẫn còn hàng</button>`;
    $("nhac").hidden = false;
    $("xn-tat-ca").onclick = async (e) => {
      e.target.disabled = true; e.target.textContent = "Đang gửi…";
      await Promise.allSettled(canNhac.map((l) => lenh(`/v1/lots/${l.id}/confirm-available`, {})));
      location.reload();
    };
  }

  // Nhóm theo trạng thái (chỉ nhóm có lô); một nhóm thì không cần nút lọc
  const anDi = lo.filter((l) => l.status === "on_sale" && l.an_tu_dong);
  const nhom = [
    ["on_sale", "Đang bán", lo.filter((l) => l.status === "on_sale" && !l.an_tu_dong)],
    ["an", "Bên mua không thấy", anDi],
    ...Object.entries(TT).filter(([k]) => k !== "on_sale").map(([k, [ten]]) => [k, ten, lo.filter((l) => l.status === k)]),
  ].filter(([, , d]) => d.length);
  if (!nhom.length) nhom.push(["on_sale", "Đang bán", []]);
  let chon = nhom[0][0];
  $("loc").hidden = nhom.length < 2;
  $("loc").innerHTML = nhom.length > 1 ? nhom.map(([k, ten, d]) => `<button type="button" data-k="${k}" aria-pressed="${k === chon}">${ten}<small>${d.length}</small></button>`).join("") : "";
  $("loc").querySelectorAll("button").forEach((b) => (b.onclick = () => { chon = b.dataset.k; ve(); }));
  const ve = () => {
    $("loc").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === chon)));
    const d = nhom.find(([k]) => k === chon)[2];
    $("ds").innerHTML = d.length ? d.map((l) => {
      const q = qty.get(l.id) || { available: l.available_g };
      const phan = [["con", "Còn bán", q.available, "var(--la)"], ["giu", "Đang giữ", q.held, "#e2b24a"], ["hua", "Trong hợp đồng", BigInt(q.committed || 0) + BigInt(q.in_transit || 0), "#4f7fb8"], ["giao", "Đã giao", q.delivered, "#9aa59f"]]
        .map(([k, ten, g, mau]) => [k, ten, Number(g || 0), mau]);
      const tong = phan.reduce((s, [, , g]) => s + g, 0) || 1;
      const conGap = l.ban_gap_den && new Date(l.ban_gap_den) > new Date() && l.status === "on_sale";
      const [tt, lop] = l.an_tu_dong ? ["Bên mua không thấy", "gap"] : conGap ? ["Đang bán nhanh", "vang"] : TT[l.status] || [l.status, "cho"];
      const anh = ANH_SP(l.product_code);
      const chaoLo = (dsChao || []).filter((c) => c.lot_code === l.code);
      const hoi = chaoLo.length;
      const lauChuaXn = l.status === "on_sale" && (!l.last_confirmed_at || (Date.now() - new Date(l.last_confirmed_at)) / 864e5 > NGAY_NHAC);
      return `<article class="lo" data-lo="${esc(l.code)}">
        <a class="dau-lo" href="./ban-lo.html?id=${encodeURIComponent(l.id)}" aria-label="Xem chi tiết lô ${esc(l.code)}"><span class="anh" ${anh ? `style="background-image:url(${anh})"` : ""}></span>
          <span style="min-width:0"><p class="ten">${esc(tenSp.get(l.product_code) || l.product_code)}</p>
            <p class="loai">${esc(tenLoai(l.grade_code))} <span class="tt ${lop}">${esc(tt)}</span></p>
            <p class="phu">${esc(l.code)} · ${l.qty_basis === "estimated" ? "lượng ước tính" : "đã cân"}${l.last_confirmed_at ? ` · báo còn hàng ${ngayVN(l.last_confirmed_at)}` : ""}</p></span><span class="mui-ct" aria-hidden="true">›</span></a>
        <div class="luong" role="img" aria-label="${phan.filter(([, , g]) => g).map(([, ten, g]) => `${ten} ${can(g).join(" ")}`).join(", ")}">${phan.filter(([, , g]) => g).map(([k, , g]) => `<i class="${k}" style="width:${(g / tong * 100).toFixed(1)}%"></i>`).join("")}</div>
        <div class="chu-luong">${phan.filter(([k, , g]) => g || k === "con").map(([, ten, g, mau]) => `<span style="--c:${mau}">${ten} <b>${can(g).join(" ")}</b></span>`).join("")}</div>
        ${chaoLo.length ? `<div class="chao-lo">${chaoLo.map((c) => dongChao(c, false)).join("")}</div>` : ""}
        <div class="duoi"><span class="hoi">${hoi ? `<b>${hoi}</b> lời chào đang mở` : "Chưa có lời chào"}</span>
          <span class="nut-hang">${lauChuaXn ? `<button type="button" class="xac-nhan" data-xn="${l.id}">Vẫn còn hàng</button>` : ""}${l.status === "on_sale" ? `<button type="button" class="nut-ql" data-ql="${l.id}">Quản lý lô</button>` : ""}</span></div>
        ${l.goi_y_ban_gap ? `<p class="goi-y">Lô này lâu chưa có người hỏi. Bác có thể bật bán nhanh (bên mua chỉ thấy "giao được trong 48 giờ"), hoặc nhắn AgiViet hỏi ứng tiền, kho lạnh.</p>` : ""}
      </article>`;
    }).join("") : `<div class="trong"><p><b>Chưa có lô nào ở đây</b></p><p style="margin-top:4px">Bấm nút Đăng bài ở giữa thanh dưới để đăng hàng.</p></div>`;
    $("ds").setAttribute("aria-label", `${d.length} lô`);
    $("ds").querySelectorAll("[data-ql]").forEach((b) => (b.onclick = () => moQuanLy(lo.find((x) => x.id === b.dataset.ql))));
    $("ds").querySelectorAll("[data-xn]").forEach((b) => (b.onclick = async () => {
      b.disabled = true; b.textContent = "Đang gửi…";
      try { await lenh(`/v1/lots/${b.dataset.xn}/confirm-available`, {}); b.textContent = "Đã xác nhận"; } catch (e) { b.textContent = "Thử lại"; b.disabled = false; }
    }));
  };
  ve();
}

async function moCan() {
  const nc = await get("/v1/demands").catch(() => null);
  if (!nc) { $("ds-can").innerHTML = `<p class="bao loi">Chưa tải được nhu cầu bên mua.</p>`; return; }
  const dangBan = lo.filter((l) => l.status === "on_sale" && !l.an_tu_dong);
  const vuong = (l, ben) => dsChaoMo.some((c) => c.lot_code === l.code && c.buyer_org_id === ben);
  const loKhop = (sp, loai, ben) => dangBan.filter((l) => l.product_code === sp && l.grade_code === loai && (!ben || !vuong(l, ben)));
  const mo = nc.filter((n) => n.status === "open");
  const diem = (n) => n.lines.some((x) => loKhop(n.product_code, x.grade_code).length) ? 0 : dangBan.some((l) => l.product_code === n.product_code) ? 1 : 2;
  mo.sort((a, b) => diem(a) - diem(b));
  const soKhop = mo.filter((n) => diem(n) === 0).length;
  // Cung cầu trong vùng cho các mặt hàng bác đang bán (không nêu ai rẻ nhất)
  const spBac = [...new Set(dangBan.map((l) => l.product_code))];
  const canKg = mo.filter((n) => spBac.includes(n.product_code)).flatMap((n) => n.lines).reduce((t, x) => t + Number(x.qty_g), 0);
  const banKg = dangBan.reduce((t, l) => t + Number(l.available_g || 0), 0);
  if (spBac.length) {
    $("cung-cau").innerHTML = `<div><b>${esc(can(canKg).join(" "))}</b><span>bên mua đang cần (${mo.filter((n) => spBac.includes(n.product_code)).length} phiếu)</span></div>
      <div><b>${esc(can(banKg).join(" "))}</b><span>bác đang bán</span></div>`;
    $("cung-cau").hidden = false;
  }
  const daChao = dsChaoMo.filter((c) => c.direction === "seller_quote");
  if (daChao.length) { $("ds-da-chao").innerHTML = daChao.map((c) => dongChao(c)).join(""); $("khoi-da-chao").hidden = false; }
  $("so-can").textContent = soKhop ? soKhop : "";
  const veNc = (n) => {
    const khop = diem(n) === 0;
    return `<article class="the-nc">
      <a class="dau-nc" href="./ban-nhu-cau.html?id=${encodeURIComponent(n.id)}"><span><p class="ben">${esc(n.buyer_name)}</p>
      <p class="sp-nc">${esc(tenSp.get(n.product_code) || n.product_code)} <span>· cần ${ngayVN(n.needed_from)}–${ngayVN(n.needed_to)}</span></p>
      <p class="phu">${esc(NHOM_MUA[n.segment_code] || n.segment_code)}</p>
      <p class="nhan-nc">${khop ? '<span class="khop">Khớp hàng của bác</span>' : ""}${n.lines.some((x) => x.min_source_qty_g && Number(x.min_source_qty_g) < Number(x.qty_g)) ? '<span class="gom">Nhận gom nhiều vườn</span>' : ""}</p></span><span class="mui-ct" aria-hidden="true">›</span></a>
      ${n.lines.map((x) => { const k = loKhop(n.product_code, x.grade_code, n.buyer_org_id), daChao = dsChaoMo.some((c) => c.demand_line_id === x.id);
        const nhan = daChao ? ["Bác đã chào", "da"] : !k.length && loKhop(n.product_code, x.grade_code).length ? ["Đang có lời chào", "da"] : !k.length ? ["Bác chưa có hàng này", "chua"] : null;
        return `<div class="dong"><span>${esc(tenLoai(x.grade_code))}</span><span class="sl">${can(x.qty_g).join(" ")}</span>
          ${nhan ? `<span class="tt-dong ${nhan[1]}">${nhan[0]}</span>` : `<button type="button" data-nc="${n.id}" data-dong="${x.id}" aria-label="Chào hàng cho ${esc(n.buyer_name)}">Chào hàng</button>`}</div>`; }).join("")}
    </article>`;
  };
  const lienQuan = mo.filter((n) => diem(n) < 2), khac = mo.filter((n) => diem(n) === 2);
  $("ds-can").innerHTML = (lienQuan.length ? lienQuan.map(veNc).join("") : `<div class="trong">Chưa có bên mua nào cần mặt hàng bác đang bán.</div>`)
    + (khac.length ? `<details class="nc-khac"><summary>Nhu cầu mặt hàng khác <small>${khac.length}</small></summary>${khac.map(veNc).join("")}</details>` : "");
  $("ds-can").querySelectorAll("button[data-dong]").forEach((b) => (b.onclick = () => {
    const n = mo.find((x) => x.id === b.dataset.nc), dong = n.lines.find((x) => x.id === b.dataset.dong);
    moTam(n, dong, loKhop(n.product_code, dong.grade_code, n.buyer_org_id));
  }));
}

// Tấm chào hàng: chọn lô khớp, lượng, giá → lời chào của người bán vào nhu cầu
function moTam(n, dong, dsLo) {
  const che = document.createElement("div"); che.className = "man-che";
  const toiDaKg = (l) => Math.floor(Math.min(Number(l.available_g), Number(dong.qty_g)) / 1000);
  che.innerHTML = `<form class="tam" role="dialog" aria-modal="true" aria-labelledby="tam-t">
    <h2 id="tam-t">Chào hàng cho ${esc(n.buyer_name)}</h2>
    <label>Lô của bác<select name="lo">${dsLo.map((l) => `<option value="${l.id}">${esc(l.code)} · còn ${can(l.available_g).join(" ")}</option>`).join("")}</select></label>
    <label>Lượng (kg)<input name="kg" type="number" inputmode="numeric" min="1" required></label>
    <label>Giá (đồng/kg) <span class="goi-y-gia" id="gy-gia"></span><input name="gia" type="number" inputmode="numeric" min="1000" step="100" required></label>
    <p class="thanh-tien" id="thanh-tien" aria-live="polite"></p>
    <p class="bao-ket" id="tam-bao" role="status"></p>
    <div class="hang-nut"><button type="button" class="nut phu-nut" id="tam-huy">Đóng</button><button type="submit" class="nut chinh-nut" id="tam-gui">Gửi chào hàng</button></div>
  </form>`;
  document.body.appendChild(che);
  const f = che.querySelector("form");
  const capNhat = () => { const l = dsLo.find((x) => x.id === f.lo.value); f.kg.max = toiDaKg(l); if (!f.kg.value || Number(f.kg.value) > toiDaKg(l)) f.kg.value = toiDaKg(l); };
  const tinhTien = () => { const k = Number(f.kg.value), g = Number(f.gia.value);
    $("thanh-tien").innerHTML = k > 0 && g > 0 ? `Thành tiền: <b>${(k * g).toLocaleString("vi-VN")} đ</b> <small>(${k.toLocaleString("vi-VN")} kg × ${g.toLocaleString("vi-VN")} đ)</small>` : ""; };
  f.kg.oninput = tinhTien; f.gia.oninput = tinhTien;
  f.lo.onchange = () => { capNhat(); tinhTien(); }; capNhat(); tinhTien();
  get(`/v1/reference-prices?product=${encodeURIComponent(n.product_code)}&grade=${encodeURIComponent(dong.grade_code)}`).then((g) => {
    if (g?.price_vnd) { $("gy-gia").textContent = `Giá tham khảo ${Number(g.price_vnd).toLocaleString("vi-VN")} đ/kg`; if (!f.gia.value) { f.gia.value = g.price_vnd; tinhTien(); } /* không ghi đè giá bác đã gõ */ }
  }).catch(() => {});
  const dong_ = () => che.remove();
  che.addEventListener("pointerdown", (e) => { if (e.target === che) dong_(); });
  $("tam-huy").onclick = dong_;
  f.onsubmit = async (e) => {
    e.preventDefault();
    $("tam-gui").disabled = true; $("tam-bao").textContent = "Đang gửi…";
    try {
      await lenh("/v1/offers", { direction: "seller_quote", lot_id: f.lo.value, demand_line_id: dong.id, qty_g: String(Number(f.kg.value) * 1000), price_vnd: String(f.gia.value) });
      f.innerHTML = `<h2>Đã gửi chào hàng</h2><p class="bao-ket">${esc(n.buyer_name)} có 24 giờ để trả lời. Bác theo dõi ở Tin nhắn.</p>
        <div class="hang-nut"><button type="button" class="nut phu-nut" id="tam-xong">Đóng</button><a class="nut chinh-nut" href="./ban-tin-nhan.html${location.search}">Mở Tin nhắn</a></div>`;
      f.querySelector("#tam-xong").onclick = dong_;
    } catch (err) { $("tam-bao").textContent = err.message; $("tam-gui").disabled = false; }
  };
}

const TT_DON = { drafting: "Đang soạn hợp đồng", awaiting_signatures: "Chờ ký", awaiting_deposit: "Chờ bên mua cọc", active: "Đang thực hiện", completed: "Đã xong", cancelled: "Đã hủy" };
async function moVu() {
  const ds = await get("/v1/seasonal-orders").catch(() => null);
  if (!ds) { $("ds-vu").innerHTML = `<p class="bao loi">Chưa tải được hợp đồng mùa vụ.</p>`; return; }
  const cuaBac = ds.filter((v) => v.phia === "seller");
  $("so-vu").textContent = cuaBac.length || "";
  const kg = (g) => can(g).join(" ");
  $("ds-vu").innerHTML = cuaBac.length ? cuaBac.map((v) => {
    const bt = v.contract_type === "offtake";
    const luong = v.qty_min_g === v.qty_max_g ? kg(v.qty_min_g) : `${kg(v.qty_min_g)} – ${kg(v.qty_max_g)}`;
    return `<a class="vu" href="./ban-tin-nhan.html${location.search}">
      <span class="loai-hd ${bt ? "bt" : ""}">${bt ? "Bao tiêu theo vụ" : "Đặt trước khi hái"}</span>
      <p class="ben">${esc(v.buyer_name)}</p>
      <p class="phu">${esc(v.product_name)} · ${esc(v.code)}</p>
      <dl><dt>Lượng</dt><dd>${esc(luong)}</dd>
        <dt>Giá</dt><dd>${Number(v.unit_price_vnd).toLocaleString("vi-VN")} đ/kg${v.price_mode === "formula" ? " (theo công thức)" : ""}</dd>
        <dt>Cọc bên mua</dt><dd>${Number(v.deposit_vnd).toLocaleString("vi-VN")} đ</dd>
        <dt>Mùa hái</dt><dd>${ngayVN(v.harvest_from)} – ${ngayVN(v.harvest_to)}</dd>
        <dt>Vườn</dt><dd>${esc(v.site_name || "—")}</dd>
        ${v.so_dot > 1 ? `<dt>Số đợt giao</dt><dd>${v.so_dot}</dd>` : ""}</dl>
      <p class="tt-vu">${esc(TT_DON[v.order_status] || v.order_status)} ›</p></a>`;
  }).join("") : `<div class="trong">Bác chưa có hợp đồng đặt trước hay bao tiêu nào. Khi bên mua muốn đặt hàng trước mùa, hợp đồng sẽ hiện ở đây.</div>`;
}

async function mo() {
  token = await phien();
  await moHang();
  await moCan();
  await moVu();
  giuThamSo();
  $("noi").setAttribute("aria-busy", "false");
}
mo().catch((e) => {
  $("ds").innerHTML = `<p class="bao loi">${esc(e.message)}</p><button class="nut phu-nut" type="button" style="margin-top:12px" onclick="location.reload()">Thử lại</button>`;
  $("noi").setAttribute("aria-busy", "false");
});
</script>
