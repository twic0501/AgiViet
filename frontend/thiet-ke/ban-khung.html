<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="/thiet-ke/chuyen-trang.css"><script src="/thiet-ke/chuyen-trang.js"></script>
<title>Hợp đồng khung · AgiViet bán (bản mẫu)</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="./so-vuon.css">
<style>
  /* Cùng kiểu thẻ với màn hợp đồng (ban-don.html) — hợp đồng giữ thiết kế cũ. */
  .hd-the { border-radius: 18px; background: var(--giay-noi); box-shadow: 0 0 0 1px var(--ke); padding: 4px 16px 12px; display: grid; gap: 8px; min-width: 0; }
  .hd-the > h3 { margin: 12px 0 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .hd-the > h3 .cham { width: 8px; height: 8px; border-radius: 50%; background: var(--vang-lua); }
  .hd-dong { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 11px 0; border-bottom: 1px solid var(--ke); align-items: center; }
  .hd-dong:last-child { border-bottom: 0; }
  .hd-dong span { color: var(--muc-phu); font-size: 14.5px; }
  .hd-dong b { text-align: right; font-variant-numeric: tabular-nums; }
  .hd-ghi { margin: 0; color: var(--muc-phu); font-size: 15px; line-height: 1.5; }
  .hd-bao { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--vang-lua-nhat); font-size: 15.5px; line-height: 1.45; }
  .hd-bao.do { background: #fbe3df; color: #6b1d13; }
  .hd-nut { display: flex; gap: 10px; flex-wrap: wrap; }
  .hd-nut .nut { flex: 1 1 140px; }
  .hd-o { display: grid; gap: 6px; font-weight: 600; font-size: 15px; }
  .hd-o input { min-height: 52px; border-radius: 12px; border: 1.5px solid var(--ke-dam, #c9c2b3); padding: 0 14px; font: inherit; font-size: 22px; letter-spacing: 6px; width: 100%; box-sizing: border-box; background: #fff; }
  .hd-chon { display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; line-height: 1.45; }
  .hd-chon input { width: 22px; height: 22px; flex: none; margin-top: 2px; }
  .tuan { border-top: 1px solid var(--ke); padding-top: 10px; display: grid; gap: 8px; }
  .nhan { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--ke); max-width: 100%; }
  .nhan.bac { background: var(--vang-lua-nhat); color: var(--nau-dat); }
</style>
</head>
<body>
<div class="trang">
  <header class="dau dau-xanh nen-xanh" id="dau"></header>
  <main class="noi" id="noi" style="gap:16px;"><div class="khung-tai" style="height:120px"></div></main>
</div>
<script type="module">
import { esc, phien, giuThamSo } from "./chung.js";
const $ = (id) => document.getElementById(id);
const id = new URLSearchParams(location.search).get("id");
$("dau").innerHTML = `<button class="nut-tron" type="button" id="dong" aria-label="Quay lại"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div style="flex:1;min-width:0"><p class="chao">Hợp đồng khung theo tuần</p><h1 id="tieu">Đang tải…</h1></div>`;
$("dong").onclick = () => (history.length > 1 ? history.back() : (location.href = "./ban-hop-dong.html" + location.search));
let token;
const vnd = (x) => `${Number(x || 0).toLocaleString("vi-VN")} đ`;
const kg = (g) => `${(Number(g || 0) / 1000).toLocaleString("vi-VN")} kg`;
const THU = ["Chủ nhật", "Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7"];
const ngay = (s) => (s ? new Date(s).toLocaleDateString("vi-VN", { weekday: "short", day: "2-digit", month: "2-digit" }) : "");
const dong = (a, b) => `<div class="hd-dong"><span>${a}</span><b>${b}</b></div>`;
async function goi(duong, than) {
  const r = await fetch(duong, than ? { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + token }, body: JSON.stringify({ idempotency_key: crypto.randomUUID(), ...than }) } : { headers: { authorization: "Bearer " + token } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = j.errors?.[0] || {}; throw new Error([e.message, e.fix].filter(Boolean).join(" ") || "Chưa làm được, bác thử lại."); }
  return j.data ?? j;
}
// Ô nhập mã OTP dùng chung: bấm lần 1 gửi mã, lần 2 xác nhận.
function khoiOtp(goc, guiMa, xacNhan, chuNut) {
  goc.insertAdjacentHTML("beforeend", `<label class="hd-o" data-otp hidden>Mã 6 số trong tin nhắn<input inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label>
    <button class="nut chinh-nut" type="button" data-di>${chuNut[0]}</button><p class="hd-ghi" data-b role="status"></p>`);
  let ch = null; const nut = goc.querySelector("[data-di]"), o = goc.querySelector("[data-otp]"), b = goc.querySelector("[data-b]");
  nut.onclick = async () => {
    nut.disabled = true; b.textContent = "";
    try {
      if (!ch) { ch = await guiMa(); o.hidden = false; o.querySelector("input").focus(); nut.textContent = chuNut[1]; }
      else { const ma = o.querySelector("input").value.trim(); if (!/^\d{6}$/.test(ma)) throw new Error("Bác nhập đủ 6 số trong tin nhắn."); await xacNhan(ch, ma); return ve(); }
    } catch (e) { b.textContent = e.message; }
    nut.disabled = false;
  };
}
async function ve() {
  const k = await goi("/v1/frameworks/" + id);
  $("tieu").textContent = `${k.code} · ${k.ben_mua}`;
  const hm = k.han_muc || {}, chay = ["running", "needs_security"].includes(k.status);
  const toiKy = k.status === "awaiting_signature";
  $("noi").innerHTML = `
    <p class="hd-bao${toiKy ? "" : " "}">${toiKy ? "<b>Tới lượt bác ký.</b> Bên mua đã ký trước." : `<b>${esc(k.ten_trang_thai)}</b>`}</p>
    <section class="hd-the"><h3><i class="cham"></i>Điều khoản</h3>
      ${dong("Ngày giao", (k.ngay_giao || []).map((x) => THU[x]).join(", "))}${dong("Kỳ khung", `${esc(String(k.ky?.tu || "").slice(0, 10))} → ${esc(String(k.ky?.den || "").slice(0, 10))}`)}
      ${(k.mon || []).map((m) => dong(`${esc(m.mat_hang)} ${esc(m.loai)} mỗi buổi`, `${kg(m.luong_g)} · ${Number(m.gia_vnd).toLocaleString("vi-VN")} đ/kg`)).join("")}
      ${dong("Cọc khung (ngân hàng giữ)", vnd(k.coc_khung_vnd))}${dong("Tiền về tài khoản", esc(k.tai_khoan_ban || ""))}
      <p class="hd-ghi">Giá chốt lại mỗi tuần: bác không đồng ý giá tuần nào thì tuần đó tạm dừng. Bên mua trả gộp cuối tuần trong 72 giờ; nợ chưa trả vượt cọc thì bên mua không gọi buổi mới được.</p></section>
    <div id="ky"></div><div id="gia"></div><div id="buoi"></div><div id="tien"></div>`;
  if (toiKy) {
    $("ky").outerHTML = `<section class="hd-the" id="ky"><h3><i class="cham"></i>Ký hợp đồng khung</h3>
      <label class="hd-chon"><input type="checkbox" id="cam-ket"> Tôi đã đọc lịch giao, món, giá và cam kết giao đúng lịch.</label></section>`;
    const goc = $("ky");
    khoiOtp(goc, async () => { if (!$("cam-ket").checked) throw new Error("Bác đánh dấu ô cam kết trước."); return (await goi("/v1/otp/challenges", { purpose: "contract_sign", document_id: k.document_id })).challenge_id; },
      (ch, ma) => goi(`/v1/frameworks/${k.id}/sign`, { challenge_id: ch, code: ma }), ["Gửi mã để ký", "Ký hợp đồng khung"]);
  }
  if (!chay) return;
  // Tuần đã có giá mới (đề nghị/chốt) thì ẩn dòng bị từ chối trước đó cho gọn.
  const gia = (k.gia_tuan || []).filter((x) => x.trang_thai !== "rejected" || !(k.gia_tuan || []).some((y) => y.tuan === x.tuan && y.trang_thai !== "rejected"));
  $("gia").outerHTML = `<section class="hd-the" id="gia"><h3><i class="cham"></i>Giá từng tuần</h3>
    ${gia.length ? gia.map((x) => { const toi = x.trang_thai === "proposed" && x.de_nghi_boi === "buyer";
      const thap = x.items.some((it) => it.downgrade_price_vnd && Number(it.downgrade_price_vnd) * 10 < Number(it.unit_price_vnd) * 7);
      return `<div class="tuan" data-id="${x.id}" data-thap="${thap ? 1 : ""}"><div style="display:flex;justify-content:space-between;gap:6px 8px;align-items:center;flex-wrap:wrap"><b>Tuần từ ${ngay(x.tuan)}</b><span class="nhan${toi ? " bac" : ""}">${x.trang_thai === "agreed" ? "Đã chốt" : x.trang_thai === "rejected" ? "Không đồng ý" : toi ? "Bên mua đề nghị · tới lượt bác" : "Chờ bên mua"}</span></div>
        ${x.items.map((it, i) => dong(esc(k.mon[i]?.mat_hang || ""), `${Number(it.unit_price_vnd).toLocaleString("vi-VN")} đ/kg${it.downgrade_price_vnd ? ` · xuống loại ${Number(it.downgrade_price_vnd).toLocaleString("vi-VN")}` : ""}`)).join("")}
        ${toi && thap ? `<label class="hd-chon"><input type="checkbox" data-ack> Giá xuống loại thấp hơn 70% giá món. Tôi đã xem và chấp nhận.</label>` : ""}
        ${toi ? `<div class="hd-nut"><button class="nut chinh-nut" data-tl="1">Đồng ý giá tuần</button><button class="nut phu-nut" data-tl="0">Không đồng ý</button></div>` : ""}
        <p class="hd-ghi" data-b role="status"></p></div>`; }).join("") : `<p class="hd-ghi">Bên mua chưa đề nghị giá tuần nào.</p>`}</section>`;
  $("gia").onclick = async (e) => { const n = e.target.closest("[data-tl]"); if (!n) return; const r = n.closest("[data-id]"), b = r.querySelector("[data-b]");
    if (n.dataset.tl === "1" && r.dataset.thap && !r.querySelector("[data-ack]").checked) { b.textContent = "Bác đánh dấu ô xác nhận giá xuống loại trước."; return; }
    n.disabled = true; try { await goi(`/v1/framework-week-prices/${r.dataset.id}/answer`, { dong_y: n.dataset.tl === "1", low_downgrade_price_ack: !!r.querySelector("[data-ack]")?.checked }); await ve(); } catch (err) { b.textContent = err.message; n.disabled = false; } };
  if ((k.buoi || []).length) $("buoi").outerHTML = `<section class="hd-the"><h3><i class="cham"></i>Các buổi bên mua đã gọi</h3>${k.buoi.map((b) => `<a class="hd-dong" href="./ban-don.html?id=${b.id}${location.search.replace("?", "&").replace(/&id=[^&]*/, "")}" style="text-decoration:none;color:inherit"><span>${esc(String(b.code).replace(/^HD-/, "HĐ-"))} · ${ngay(b.ngay_giao)}</span><b>${vnd(b.gia_tri_vnd)}</b></a>`).join("")}</section>`;
  const ky = k.ky_tuan || [];
  $("tien").outerHTML = `<section class="hd-the" id="tien"><h3><i class="cham"></i>Tiền gộp cuối tuần</h3>
    ${ky.length ? ky.map((p) => `<div class="tuan" data-p="${p.payment_id}" data-so="${p.gia_tri_vnd}"><div style="display:flex;justify-content:space-between;gap:6px 8px;align-items:center;flex-wrap:wrap"><b>Tuần từ ${ngay(p.tu)} · ${vnd(p.gia_tri_vnd)}</b><span class="nhan${p.trang_thai_tra === "payer_reported" ? " bac" : ""}">${p.trang_thai_tra === "fully_received" ? "Bác đã nhận đủ" : p.trang_thai_tra === "payer_reported" ? "Bên mua báo đã chuyển · tới lượt bác" : `Bên mua trả trước ${ngay(p.han_tra)}`}</span></div>
      ${p.trang_thai_tra === "payer_reported" ? `<p class="hd-ghi">Bác mở app ngân hàng xem tiền đã về chưa. Chỉ bấm khi đã thấy tiền.</p><label class="hd-o" style="font-size:15px">Mã giao dịch ngân hàng<input data-ma style="font-size:17px;letter-spacing:0"></label><div data-otp-goc></div>` : ""}</div>`).join("") : `<p class="hd-ghi">Chưa có khoản tuần nào. Hết tuần, các buổi đã chốt số gộp thành một khoản, bên mua chuyển thẳng cho bác.</p>`}</section>`;
  document.querySelectorAll("[data-otp-goc]").forEach((goc) => { const r = goc.closest("[data-p]");
    khoiOtp(goc, async () => { if (!r.querySelector("[data-ma]").value.trim()) throw new Error("Bác nhập mã giao dịch trong app ngân hàng."); return (await goi("/v1/otp/challenges", { purpose: "money_received", payment_id: r.dataset.p, amount_vnd: r.dataset.so })).challenge_id; },
      (ch, ma) => goi(`/v1/payments/${r.dataset.p}/confirm`, { challenge_id: ch, code: ma, amount_vnd: Number(r.dataset.so), result: "full", bank_txn_ref: r.querySelector("[data-ma]").value.trim() }), [`Tôi đã nhận đủ ${vnd(r.dataset.so)}`, "Xác nhận đã nhận"]); });
}
giuThamSo();
(async () => { token = await phien(); await ve(); })().catch((e) => { $("noi").innerHTML = `<p class="hd-bao do">${esc(e.message)}</p>`; });
</script>
</body>
</html>
