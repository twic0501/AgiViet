<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đăng nhập · AgiViet bán (bản mẫu)</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="./so-vuon.css">
<style>
  body { overflow: hidden; }
  .vao { height: 100dvh; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; position: relative;
    background: radial-gradient(120% 70% at 50% 38%, #fbf8f1 0%, var(--giay) 60%, #eee7d3 100%); }
  .cau { flex: 1; min-height: 0; position: relative; }
  .cau canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .chan { padding: 0 24px calc(24px + env(safe-area-inset-bottom)); text-align: center; }
  .chan .hieu { display: inline-flex; align-items: center; gap: 10px; }
  .chan .hieu img { width: 36px; height: 36px; }
  .chan .hieu b { font-size: 26px; font-weight: 700; color: var(--la); letter-spacing: -0.02em; }
  .chan .cau-ngan { margin: 8px 0 28px; color: var(--muc-phu); font-size: 16px; }
  .hai-nut { display: grid; gap: 10px; }
  .nut.vien { background: transparent; color: var(--la); box-shadow: inset 0 0 0 1.5px var(--la); }
  /* Tấm nhập trượt lên */
  .man-che { position: fixed; inset: 0; background: rgba(20, 28, 23, 0.32); opacity: 0; pointer-events: none; transition: opacity 220ms var(--cham); }
  .man-che.mo { opacity: 1; pointer-events: auto; }
  .tam { position: fixed; left: 50%; bottom: 0; width: min(100%, 480px); transform: translate(-50%, 104%); background: var(--giay);
    border-radius: 24px 24px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom)); transition: transform 320ms var(--cham); max-height: 92dvh; overflow-y: auto; }
  .tam.mo { transform: translate(-50%, 0); }
  .tam .tay-cam { width: 40px; height: 4px; border-radius: 2px; background: var(--ke-dam); margin: 0 auto 16px; }
  .tam h2 { font-size: 24px; letter-spacing: -0.015em; }
  .tam .phu-de { color: var(--muc-phu); margin: 4px 0 20px; }
  .o-nhap { display: flex; align-items: center; border-radius: 14px; background: var(--giay-lot); border: 1.5px solid var(--ke-dam); overflow: hidden; transition: border-color 140ms var(--cham); }
  .o-nhap:focus-within { border-color: var(--la); }
  .o-nhap .ma-vung { padding: 0 12px 0 16px; font-weight: 600; color: var(--muc-phu); border-right: 1px solid var(--ke-dam); height: 56px; display: grid; place-items: center; }
  .o-nhap input { flex: 1; min-width: 0; height: 56px; border: 0; background: transparent; padding: 0 16px; font: 600 20px/1 var(--chu); color: var(--muc); letter-spacing: 0.04em; font-variant-numeric: tabular-nums; outline: none; }
  .o-chu { width: 100%; height: 52px; border-radius: 12px; border: 1.5px solid var(--ke-dam); background: var(--giay-lot); padding: 0 14px; font: 400 16px/1 var(--chu); color: var(--muc); outline: none; }
  .o-chu:focus { border-color: var(--la); }
  .nhan-o { font-size: 13px; font-weight: 600; color: var(--muc-phu); margin: 14px 0 6px; display: block; }
  .chon-loai { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .chon-loai label { position: relative; }
  .chon-loai input { position: absolute; opacity: 0; }
  .chon-loai span { display: grid; place-items: center; text-align: center; min-height: 48px; padding: 6px; border-radius: 12px; border: 1.5px solid var(--ke-dam); background: var(--giay-noi); font-size: 14px; font-weight: 600; color: var(--muc-phu); cursor: pointer; }
  .chon-loai input:checked + span { border-color: var(--la); background: var(--la-nhat); color: var(--la-dam); }
  .chon-loai input:focus-visible + span { outline: 2px solid var(--tap-trung); outline-offset: 2px; }
  .otp { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .otp input { height: 60px; text-align: center; border-radius: 12px; border: 1.5px solid var(--ke-dam); background: var(--giay-lot); font: 600 24px/1 var(--chu); color: var(--muc); font-variant-numeric: tabular-nums; outline: none; min-width: 0; }
  .otp input:focus { border-color: var(--la); }
  .ghi-nho { font-size: 13px; color: var(--muc-nhat); text-align: center; margin-top: 12px; }
  .ghi-nho button { color: var(--la); font-weight: 600; background: none; border: 0; font: inherit; padding: 8px; cursor: pointer; }
  .ma-thu { font-size: 12px; color: var(--chin); background: var(--chin-nen); padding: 8px 12px; border-radius: 8px; margin-top: 12px; }
  .nut:disabled { opacity: .45; cursor: not-allowed; }
  .xong { text-align: center; padding: 8px 0; }
  .xong .dau-tich { width: 64px; height: 64px; border-radius: 50%; background: var(--la-nhat); color: var(--la); display: grid; place-items: center; margin: 0 auto 12px; }
</style>
</head>
<body>
<div class="vao">
  <div class="cau"><canvas id="cau" aria-label="Quả cầu ghép từ ảnh nông sản Việt Nam"></canvas></div>
  <div class="chan">
    <div class="hieu"><img src="/assets/logo.svg" alt=""><b>AgiViet</b></div>
    <p class="cau-ngan">Kết nối nông sản Việt</p>
    <div class="hai-nut">
      <button class="nut chinh-nut" type="button" data-mo="dang-nhap">Đăng nhập</button>
      <button class="nut vien" type="button" data-mo="dang-ky">Đăng ký bán hàng</button>
    </div>
  </div>
</div>

<div class="man-che" id="che"></div>
<section class="tam" id="tam" role="dialog" aria-modal="true" aria-labelledby="tieu-de">
  <div class="tay-cam"></div>
  <!-- Bước 1: số điện thoại (+ thông tin đăng ký) -->
  <div id="b1">
    <h2 id="tieu-de">Đăng nhập</h2>
    <p class="phu-de" id="phu-de">Nhập số điện thoại, AgiViet gửi mã 6 số.</p>
    <div id="them-dk" hidden>
      <label class="nhan-o" for="ho-ten" style="margin-top:0">Họ và tên</label>
      <input class="o-chu" id="ho-ten" autocomplete="name" placeholder="Nguyễn Văn An">
      <span class="nhan-o">Bác bán với tư cách</span>
      <div class="chon-loai">
        <label><input type="radio" name="loai" value="household" checked><span>Hộ gia đình</span></label>
        <label><input type="radio" name="loai" value="cooperative"><span>Hợp tác xã</span></label>
        <label><input type="radio" name="loai" value="coop_group"><span>Tổ hợp tác</span></label>
      </div>
      <label class="nhan-o" for="ten-cs">Tên vườn / cơ sở</label>
      <input class="o-chu" id="ten-cs" placeholder="Vườn xoài Tư An">
      <span class="nhan-o">Số điện thoại</span>
    </div>
    <div class="o-nhap"><span class="ma-vung">+84</span><input id="sdt" inputmode="numeric" autocomplete="tel" placeholder="0909 000 000" aria-label="Số điện thoại"></div>
    <p class="bao loi" id="loi-1" hidden style="margin-top:12px"></p>
    <button class="nut chinh-nut" id="gui" type="button" style="margin-top:16px" disabled>Gửi mã</button>
  </div>
  <!-- Bước 2: mã OTP -->
  <div id="b2" hidden>
    <h2>Nhập mã 6 số</h2>
    <p class="phu-de" id="gui-toi">Mã đã gửi tới số của bác.</p>
    <div class="otp" id="otp">
      <input inputmode="numeric" maxlength="1" aria-label="Số 1"><input inputmode="numeric" maxlength="1" aria-label="Số 2"><input inputmode="numeric" maxlength="1" aria-label="Số 3"><input inputmode="numeric" maxlength="1" aria-label="Số 4"><input inputmode="numeric" maxlength="1" aria-label="Số 5"><input inputmode="numeric" maxlength="1" aria-label="Số 6">
    </div>
    <p class="ma-thu" id="ma-thu" hidden></p>
    <p class="bao loi" id="loi-2" hidden style="margin-top:12px"></p>
    <p class="ghi-nho"><span id="dem"></span> <button type="button" id="gui-lai" hidden>Gửi lại mã</button> · <button type="button" id="doi-so">Đổi số</button></p>
  </div>
  <!-- Bước 3: đăng ký xong, chờ xác minh -->
  <div id="b3" hidden class="xong">
    <div class="dau-tich"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 8"/></svg></div>
    <h2>Đã nhận đăng ký</h2>
    <p class="phu-de">Nhân viên AgiViet sẽ gọi hẹn tới xác minh vườn. Trong lúc chờ, bác vẫn xem được app.</p>
    <button class="nut chinh-nut" id="vao-app" type="button">Vào app</button>
  </div>
</section>

<script type="module">
import { quaCau } from "./qua-cau.js";
const $ = (id) => document.getElementById(id);
quaCau($("cau"), { anh: ["xoai-cat-chu", "tom", "lua-gao", "ca-phe", "thanh-long", "sau-rieng", "buoi", "vai", "chuoi", "dua-hau", "rau-cai", "cu", "ho-tieu", "hat-dieu", "ca-tra", "cua"].map((n) => `/assets/products/${n}.jpg`) });

let cheDo = "dang-nhap", thuThach = null, demNguoc = null;
const chuan = (s) => s.replace(/\D/g, "");
const sdt = () => chuan($("sdt").value);
const hienLoi = (id, m) => { $(id).textContent = m; $(id).hidden = !m; };
const hopLe = () => /^0\d{9}$/.test(sdt()) && (cheDo === "dang-nhap" || ($("ho-ten").value.trim() && $("ten-cs").value.trim()));

function moTam(che) {
  cheDo = che;
  $("tieu-de").textContent = che === "dang-ky" ? "Đăng ký bán hàng" : "Đăng nhập";
  $("phu-de").textContent = che === "dang-ky" ? "Điền vài thông tin, AgiViet gửi mã 6 số để xác nhận số điện thoại." : "Nhập số điện thoại, AgiViet gửi mã 6 số.";
  $("them-dk").hidden = che !== "dang-ky";
  for (const b of ["b1", "b2", "b3"]) $(b).hidden = b !== "b1";
  hienLoi("loi-1", ""); $("gui").disabled = !hopLe();
  $("tam").classList.add("mo"); $("che").classList.add("mo");
  setTimeout(() => (che === "dang-ky" ? $("ho-ten") : $("sdt")).focus(), 320);
}
function dongTam() { $("tam").classList.remove("mo"); $("che").classList.remove("mo"); clearInterval(demNguoc); }
document.querySelectorAll("[data-mo]").forEach((b) => (b.onclick = () => moTam(b.dataset.mo)));
$("che").onclick = dongTam;
addEventListener("keydown", (e) => { if (e.key === "Escape") dongTam(); });

$("sdt").addEventListener("input", (e) => {
  const so = chuan(e.target.value).slice(0, 10);
  e.target.value = so.replace(/(\d{4})(\d{0,3})(\d{0,3})/, (_, a, b, c) => [a, b, c].filter(Boolean).join(" "));
  $("gui").disabled = !hopLe();
});
for (const id of ["ho-ten", "ten-cs"]) $(id).addEventListener("input", () => ($("gui").disabled = !hopLe()));

async function guiMa() {
  $("gui").disabled = true; $("gui").textContent = "Đang gửi…"; hienLoi("loi-1", "");
  try {
    const r = await fetch("/v1/auth/otp/send", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ phone: sdt() }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.errors?.[0]?.message || "Chưa gửi được mã. Bác thử lại sau ít phút.");
    thuThach = j.challenge_id;
    $("b1").hidden = true; $("b2").hidden = false;
    $("gui-toi").textContent = `Mã đã gửi tới ${sdt().replace(/(\d{4})(\d{3})(\d{3})/, "$1 $2 $3")}.`;
    o6.forEach((x) => (x.value = "")); o6[0].focus(); batDem(60);
    // Môi trường thử: hiện mã để kiểm (bản thật không có)
    fetch(`/v1/test/sms/${sdt()}`).then((x) => (x.ok ? x.json() : null)).then((m) => {
      const ma = JSON.stringify(m || "").match(/\b\d{6}\b/)?.[0];
      if (ma) { $("ma-thu").textContent = `Môi trường thử · mã: ${ma}`; $("ma-thu").hidden = false; }
    }).catch(() => {});
  } catch (e) { hienLoi("loi-1", e.message); }
  $("gui").textContent = "Gửi mã"; $("gui").disabled = !hopLe();
}
function batDem(s) {
  clearInterval(demNguoc); $("gui-lai").hidden = true;
  const ve = () => { $("dem").textContent = s > 0 ? `Gửi lại sau ${s} giây` : ""; if (s-- <= 0) { clearInterval(demNguoc); $("gui-lai").hidden = false; } };
  ve(); demNguoc = setInterval(ve, 1000);
}
$("gui").onclick = guiMa; $("gui-lai").onclick = guiMa;
$("doi-so").onclick = () => { $("b2").hidden = true; $("b1").hidden = false; clearInterval(demNguoc); };

const o6 = [...$("otp").querySelectorAll("input")];
const ma = () => o6.map((x) => x.value).join("");
o6.forEach((o, i) => {
  o.addEventListener("input", () => { o.value = chuan(o.value).slice(-1); if (o.value && o6[i + 1]) o6[i + 1].focus(); if (ma().length === 6) xacNhan(); });
  o.addEventListener("keydown", (e) => { if (e.key === "Backspace" && !o.value && o6[i - 1]) o6[i - 1].focus(); });
  o.addEventListener("paste", (e) => { const s = chuan(e.clipboardData.getData("text")).slice(0, 6); if (s.length > 1) { e.preventDefault(); s.split("").forEach((c, k) => { if (o6[k]) o6[k].value = c; }); if (s.length === 6) xacNhan(); } });
});
const vaoApp = () => (location.href = `./ban-hom-nay.html?thu=${sdt()}`);
async function xacNhan() {
  hienLoi("loi-2", "");
  try {
    const than = { challenge_id: thuThach, phone: sdt(), code: ma() };
    const dk = cheDo === "dang-ky";
    const r = await fetch(dk ? "/v1/auth/register" : "/v1/auth/otp/verify", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify(dk ? { ...than, name: $("ho-ten").value.trim(), org: { side: "sell", kind: document.querySelector('[name="loai"]:checked').value, display_name: $("ten-cs").value.trim() } } : than) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.errors?.[0]?.message || "Mã chưa đúng. Bác kiểm tra lại tin nhắn.");
    if (dk) { $("b2").hidden = true; $("b3").hidden = false; clearInterval(demNguoc); } else vaoApp();
  } catch (e) { hienLoi("loi-2", e.message); o6.forEach((x) => (x.value = "")); o6[0].focus(); }
}
$("vao-app").onclick = vaoApp;
</script>
</body>
</html>
