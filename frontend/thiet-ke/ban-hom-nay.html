<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hôm nay · AgiViet bán (bản mẫu)</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="./so-vuon.css">
<style>
  .hero { position: relative; overflow: hidden; color: #f6f2e7; border-radius: 0 0 32px 32px; padding-bottom: 22px; margin-bottom: 16px;
    background: radial-gradient(120% 90% at 85% 100%, #2c6a4f 0%, transparent 60%), linear-gradient(160deg, #1f4d3a 0%, #173a2c 100%); }
  .hero .hoa-van { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: rgba(246, 242, 231, 0.07); stroke-width: 1.5; }
  .dau-hero { position: relative; background: none; border: 0; z-index: 1; }
  .dau-hero .chao { color: rgba(246, 242, 231, 0.75); }
  .dau-hero h1 { color: #f6f2e7; }
  .dau-hero .anh-dai-dien { background: rgba(246, 242, 231, 0.16); color: #f6f2e7; }
  .dau-hero .nut-tron { background: rgba(246, 242, 231, 0.12); border-color: rgba(246, 242, 231, 0.18); color: #f6f2e7; }
  .dau-hero .cham-moi { background: #7ee0a3; box-shadow: 0 0 0 2px #1f4d3a; }
  .hero-than { position: relative; z-index: 1; padding: 6px 16px 0; max-width: 64%; }
  .chip-hang { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip-hero { font-size: 13px; padding: 5px 10px; border-radius: 999px; background: rgba(246, 242, 231, 0.12); color: rgba(246, 242, 231, 0.9); }
  .hero h2 { font-size: 27px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; margin-top: 12px; text-wrap: balance; }
  .hero #cau-phu { margin-top: 8px; color: rgba(246, 242, 231, 0.82); }
  .hero .nut-trong { margin-top: 14px; }
  .hero #trau { position: absolute; right: -6px; bottom: -4px; width: 150px; height: 172px; z-index: 1; }
  .dau-gon { position: fixed; top: 0; left: 50%; width: min(100%, 480px); transform: translate(-50%, -110%); z-index: 20; box-shadow: 0 4px 16px rgba(0,0,0,.06);
    transition: transform 240ms cubic-bezier(0.23, 1, 0.32, 1); }
  .dau-gon.hien { transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="trang">
  <!-- Mảng xanh đầu trang: header + việc hôm nay + trâu -->
  <header class="hero" id="hero">
    <svg class="hoa-van" viewBox="0 0 400 260" preserveAspectRatio="none" aria-hidden="true">
      <path d="M-10 70 C80 40 160 95 260 60 S380 40 420 55"/><path d="M-10 110 C90 80 170 135 270 100 S390 80 420 95"/>
      <path d="M-10 150 C100 120 180 175 280 140 S395 120 420 135"/><path d="M-10 190 C110 160 190 215 290 180 S400 160 420 175"/>
    </svg>
    <div class="dau dau-hero" id="dau"></div>
    <div class="hero-than" aria-live="polite">
      <div class="chip-hang"><span class="chip-hero" id="ngay">&nbsp;</span><span class="chip-hero" id="chip-troi" hidden></span></div>
      <h2 id="cau-chinh">Đang mở sổ…</h2>
      <p id="cau-phu">&nbsp;</p>
      <button class="nut-trong" type="button" id="nut-chinh" hidden></button>
    </div>
    <canvas id="trau" width="420" height="480" aria-hidden="true"></canvas>
  </header>
  <!-- Header gọn: hiện khi đã cuộn qua mảng xanh -->
  <div class="dau dau-gon" id="dau-gon" aria-hidden="true"></div>

  <main class="noi" id="noi" aria-busy="true">

    <section class="muc" aria-labelledby="t-hd">
      <h3 id="t-hd"><span>Hợp đồng đang làm</span><a href="#">Xem hết</a></h3>
      <div id="ds-hd"><div class="khung-tai"></div></div>
    </section>

    <section class="muc" aria-labelledby="t-lo">
      <h3 id="t-lo"><span>Hàng đang bán</span><a href="./ban-hang-hoa.html">Xem hết</a></h3>
      <div class="luoi-lo" id="ds-lo"><div class="khung-tai"></div><div class="khung-tai"></div></div>
    </section>

    <section class="muc" aria-labelledby="t-tien">
      <h3 id="t-tien"><span>Tiền</span><a href="#">Sổ tiền</a></h3>
      <div class="the-tien">
        <p class="nhan">Giá trị hợp đồng đang làm</p>
        <p class="tong" id="tong-hd">—</p>
        <div class="thanh-tien" id="thanh-tien"></div>
        <div class="chu-giai" id="chu-giai"></div>
      </div>
    </section>

    <section class="muc" aria-labelledby="t-troi">
      <h3 id="t-troi"><span id="tinh">Thời tiết</span><span style="font-weight:400">4 ngày tới</span></h3>
      <div class="troi-4" id="troi"></div>
      <p class="loi-khuyen" id="loi-khuyen" hidden></p>
    </section>
  </main>

</div>

<script src="/assets/vendor/rive/rive.js"></script>
<script type="module">
import { tien, tienDu, can, esc, so, phien, layDuLieu, ANH_SP, viecCho, CHANG, chiSoChang, LUOT, dangLam, giuThamSo, veDau, veTab, soThongBaoMoi } from "./chung.js";
veTab("trang-chu");
veDau(document.getElementById("dau"), { chao: "Chào bác", ten: "AgiViet", chuDau: "" });
// Header gọn hiện khi cuộn qua mảng xanh
new IntersectionObserver(([e]) => { const g = document.getElementById("dau-gon"); g.classList.toggle("hien", !e.isIntersecting); g.setAttribute("aria-hidden", String(e.isIntersecting)); },
  { rootMargin: "-64px 0px 0px 0px" }).observe(document.getElementById("cau-chinh"));
const $ = (id) => document.getElementById(id);
try {
  rive.RuntimeLoader.setWasmUrl("/assets/vendor/rive/rive.wasm");
  const r = new rive.Rive({ src: "/assets/trau/trau.riv", canvas: $("trau"), autoplay: !matchMedia("(prefers-reduced-motion: reduce)").matches, stateMachines: "trau", layout: new rive.Layout({ fit: rive.Fit.Contain, alignment: rive.Alignment.BottomCenter }), onLoad: () => r.resizeDrawingSurfaceToCanvas() });
} catch {}

const iconTroi = (p) => p >= 70
  ? `<svg viewBox="0 0 36 36" fill="none"><path d="M10 20a6 6 0 0 1 1-12 8 8 0 0 1 15 2 5 5 0 0 1 0 10z" fill="#c9d3dc"/><path d="M13 24l-2 5M19 24l-2 5M25 24l-2 5" stroke="#2b6cb0" stroke-width="2.4" stroke-linecap="round"/></svg>`
  : p >= 30
  ? `<svg viewBox="0 0 36 36" fill="none"><circle cx="13" cy="13" r="6" fill="#e8b53a"/><path d="M12 24a6 6 0 0 1 1-12 8 8 0 0 1 15 2 5 5 0 0 1 0 10z" fill="#dfe4e8"/></svg>`
  : `<svg viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="7" fill="#e8b53a"/><path d="M18 4v4M18 28v4M4 18h4M28 18h4M8 8l3 3M25 25l3 3M8 28l3-3M25 11l3-3" stroke="#e8b53a" stroke-width="2.4" stroke-linecap="round"/></svg>`;

// Chữ tắt tên bên mua: lấy chữ đầu của 2 từ viết hoa đầu tiên ("Nhà máy chế biến Mekong" → "NM")
const chuTat = (ten) => (ten.match(/\p{Lu}/gu) || ["?"]).slice(0, 2).join("");

async function mo() {
  const token = await phien();
  const d = await layDuLieu(token);
  const { me, tienTom, troi, tenSp } = d;
  const don = d.don.filter(dangLam);                       // chỉ hợp đồng còn đang chạy
  const lo = d.lo.filter((l) => l.status === "on_sale" && !l.an_tu_dong);   // lô bên mua đang thấy
  // Số thông báo chưa đọc lấy từ backend (lỗi tải thì không hiện chấm)
  const chuaDoc = await soThongBaoMoi(token);
  const dauBan = { chao: `Chào ${me.name.split(" ").at(-1)}`, ten: me.org.name, chuDau: me.name.split(" ").at(-1).charAt(0).toUpperCase(), soThongBao: chuaDoc };
  veDau($("dau"), dauBan); veDau($("dau-gon"), dauBan);
  $("ngay").textContent = new Date().toLocaleDateString("vi-VN", { weekday: "long", day: "numeric", month: "numeric" });

  const toiBac = don.filter((d) => d.hien_thi?.toi_luot?.phia === d.phia_cua_ban);
  const choNguoi = don.filter((d) => d.hien_thi?.toi_luot && d.hien_thi.toi_luot.phia !== d.phia_cua_ban);
  if (toiBac.length) {
    $("cau-chinh").textContent = `Bác có ${toiBac.length} việc cần làm`;
    $("cau-phu").textContent = viecCho(toiBac[0]);
    $("nut-chinh").textContent = "Làm ngay"; $("nut-chinh").hidden = false;
  } else if (choNguoi.length) {
    $("cau-chinh").textContent = "Hôm nay bác chưa có việc gấp";
    $("cau-phu").textContent = `${choNguoi.length} hợp đồng đang chờ ${(LUOT[choNguoi[0].hien_thi.toi_luot.phia]?.[1] || "bên kia").toLowerCase()}.`;
  } else {
    $("cau-chinh").textContent = "Chưa có hợp đồng nào";
    $("cau-phu").textContent = lo.length ? `Bác đang bán ${lo.length} lô, chờ bên mua chào giá.` : "Đăng một lô hàng để bên mua thấy và chào giá.";
    $("nut-chinh").textContent = "Đăng hàng"; $("nut-chinh").hidden = false;
  }

  $("ds-hd").innerHTML = don.length ? don.map((d) => {
    const k = chiSoChang(d);
    const [lop, ai] = LUOT[d.hien_thi?.toi_luot?.phia] || ["cho", "—"];
    return `<a class="the-hd" href="#">
      <div class="hang"><span class="logo-ben">${esc(chuTat(d.buyer_name))}</span>
        <span class="giua"><span class="ten">${esc(d.buyer_name)}</span><span class="phu ma">${esc(d.code)}</span><span class="gia" style="display:block;margin-top:2px" title="${esc(tienDu(d.contract_value_vnd))}">${esc(tien(d.contract_value_vnd))}</span></span></div>
      <div class="chang" aria-label="Chặng ${k + 1} trên ${CHANG.length}: ${CHANG[k]}">${CHANG.map((_, i) => `<i class="${i < k ? "xong" : i === k ? "dang" : ""}"></i>`).join("")}</div>
      <div class="chang-ten">${CHANG.map((c, i) => `<span class="${i === k ? "dang" : ""}">${c}</span>`).join("")}</div>
      <div class="cho-ai"><span class="dau-luot ${lop}">${esc(ai)}</span><span>${esc(viecCho(d))}</span></div></a>`;
  }).join("") : `<p class="bao" style="margin-top:12px">Khi bác đồng ý một lời chào giá, hợp đồng sẽ hiện ở đây.</p>`;

  $("ds-lo").innerHTML = lo.length ? lo.slice(0, 4).map((l) => {
    const [soKg, dvKg] = can(l.available_g);
    const ti = Math.max(0, Math.min(1, Number(l.available_g) / Number(l.declared_qty_g || l.available_g || 1)));
    const anh = ANH_SP(l.product_code);
    return `<a class="the-lo" href="./ban-hang-hoa.html">
      <div class="anh ${anh ? "" : "anh-trong"}" ${anh ? `style="background-image:url(${anh})"` : ""}><span class="nhan-lo">${esc(l.code)}</span></div>
      <div class="than"><p class="ten">${esc(tenSp.get(l.product_code) || l.product_code)}</p>
        <p class="so-con">${soKg}<small>${dvKg} còn</small></p>
        <span class="thanh-con" role="img" aria-label="Còn ${(ti * 100).toFixed(0)}% lượng đăng"><span style="width:${(ti * 100).toFixed(0)}%"></span></span>
        <p class="phu">Loại ${esc(l.grade_code.replace(/^L/, ""))} · ${l.qty_basis === "estimated" ? "ước tính" : "đã cân"}</p></div></a>`;
  }).join("") : `<p class="bao" style="grid-column:1/-1">Bác chưa có lô nào đang bán.</p>`;

  const tongHd = don.reduce((s, d) => s + Number(d.contract_value_vnd || 0), 0);
  const t = tienTom.tong, coc = +t.coc_dang_giu || 0, nhan = (+t.da_nhan_truc_tiep || 0) + (+t.ngan_hang_da_chuyen_den || 0), con = +t.con_phai_nhan || 0;
  $("tong-hd").textContent = tien(tongHd); $("tong-hd").title = tienDu(tongHd);
  const phan = [["Đã nhận", nhan, "var(--la)"], ["Ngân hàng giữ cọc", coc, "var(--chin)"], ["Còn phải nhận", con, "rgba(0,0,0,.14)"]];
  $("thanh-tien").innerHTML = phan.map(([, v, m]) => `<span style="flex:${v || 0.0001};background:${m}"></span>`).join("");
  $("chu-giai").innerHTML = phan.map(([n, v, m]) => `<span title="${tienDu(v)}"><i style="background:${m}"></i>${n} <b class="so">${tien(v)}</b></span>`).join("");

  if (troi && !troi.__loi && troi.ngay?.length) {
    $("tinh").textContent = `Thời tiết · ${troi.tinh?.ten || ""}`;
    $("troi").innerHTML = troi.ngay.slice(0, 4).map((n, i) => {
      const thu = i === 0 ? "Hôm nay" : new Date(n.ngay).toLocaleDateString("vi-VN", { weekday: "short" });
      const mua = so(n.kha_nang_mua_phan_tram, 0, 100), nhiet = so(n.nhiet_do_cao_c);
      return `<div class="ngay-troi"><p class="thu">${esc(thu)}</p>${mua === null ? '<p class="phu" style="margin:14px 0">—</p>' : iconTroi(mua)}<p class="nhiet">${nhiet === null ? "—" : Math.round(nhiet) + "°"}</p>${mua === null ? "" : `<div class="mua" title="Khả năng mưa ${mua}%"><span style="width:${mua}%"></span></div>`}</div>`;
    }).join("");
    const n0 = troi.ngay[0], c0 = so(n0.nhiet_do_cao_c), m0 = so(n0.kha_nang_mua_phan_tram, 0, 100);
    if (c0 !== null) { $("chip-troi").textContent = `${troi.tinh?.ten || ""} · ${Math.round(c0)}°${m0 !== null ? ` · mưa ${m0}%` : ""}`; $("chip-troi").hidden = false; }
    const lk = troi.ngay[0].loi_khuyen?.[0];
    if (lk) { $("loi-khuyen").innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span>${esc(lk)}</span>`; $("loi-khuyen").hidden = false; }
  } else {
    $("troi").innerHTML = `<p class="bao" style="grid-column:1/-1">${troi?.__loi ? "Chưa tải được thời tiết." : "Chưa có dữ liệu thời tiết."}</p>`;
  }
  giuThamSo();   // liên kết vừa dựng cũng giữ phiên thử
  $("noi").setAttribute("aria-busy", "false");
}

mo().catch((e) => {
  $("cau-chinh").textContent = "Chưa mở được sổ";
  $("cau-phu").textContent = e.message;
  $("ds-hd").innerHTML = `<p class="bao loi" style="margin-top:12px">Không tải được.</p><button class="nut phu-nut" type="button" style="margin-top:12px" onclick="location.reload()">Thử lại</button>`;
  $("ds-lo").innerHTML = "";
  $("noi").setAttribute("aria-busy", "false");
});
</script>
</body>
</html>
