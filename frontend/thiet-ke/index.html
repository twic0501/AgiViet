<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bàn thiết kế AgiViet</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="./so-vuon.css">
<style>
  body { background: #2a332d; color: #ece8dc; }
  .ban { display: grid; grid-template-columns: 260px 1fr; min-height: 100dvh; }
  .ben { padding: 20px 12px 40px; border-right: 1px solid rgba(236,232,220,.12); height: 100dvh; overflow-y: auto; position: sticky; top: 0; scrollbar-width: thin; }
  .ben h1 { font-size: 16px; margin: 0 8px 4px; }
  .ben > p { font-size: 13px; color: #b9bdb0; margin: 0 8px 12px; }
  .ben a { display: block; padding: 7px 10px; border-radius: 8px; color: #ece8dc; text-decoration: none; font-size: 13.5px; line-height: 1.35; }
  .ben a:hover { background: rgba(236,232,220,.07); }
  .ben a[aria-current="true"] { background: #1f4d3a; }
  .ben details { margin-top: 10px; }
  .ben summary { cursor: pointer; list-style: none; padding: 8px 10px; border-radius: 8px; font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; }
  .ben summary::-webkit-details-marker { display: none; }
  .ben summary small { color: #8f9488; font-weight: 500; }
  .ben .nhom { font-size: 12px; color: #a3a89b; font-weight: 600; margin: 12px 10px 2px; }
  .san { display: flex; gap: 28px; align-items: flex-start; justify-content: center; padding: 28px; flex-wrap: wrap; }
  .may { width: 390px; height: 844px; border-radius: 36px; overflow: hidden; border: 10px solid #111; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.4); flex: none; }
  .may iframe { width: 100%; height: 100%; border: 0; display: block; }
  .ban-may { width: calc(1280px * var(--ti)); height: calc(820px * var(--ti)); border-radius: 12px; overflow: hidden; border: 8px solid #111; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.4); flex: none; box-sizing: content-box; }
  .ban-may iframe { width: 1280px; height: 820px; border: 0; display: block; transform: scale(var(--ti)); transform-origin: 0 0; }
  .nhan-may { text-align: center; font-size: 12px; color: #b9bdb0; margin-top: 8px; }
</style>
</head>
<body>
<div class="ban">
  <nav class="ben" id="ben">
    <h1>Bàn thiết kế AgiViet</h1>
    <p>Ba app, mọi màn theo luồng. Trang tự tải lại khi có bản mới.</p>
  </nav>
  <main class="san" id="san"></main>
</div>
<script>
  const T = "?thu=0918000421";
  const BAN = [
    ["Bắt đầu", [["Đăng nhập · mã · PIN", "dang-nhap.html"], ["Chào mừng", "ban-bat-dau.html?buoc=chao-mung"], ["Bạn bán thế nào?", "ban-bat-dau.html?buoc=vai-tro"], ["Mặt hàng", "ban-bat-dau.html?buoc=mat-hang"], ["Hồ sơ", "ban-bat-dau.html?buoc=ho-so"], ["Khai báo vườn", "ban-bat-dau.html?buoc=khai-bao-vuon"], ["Xác minh", "ban-bat-dau.html?buoc=xac-minh"], ["Trợ giúp đăng nhập", "ban-bat-dau.html?buoc=tro-giup"]]],
    ["Hôm nay", [["Trang chủ · Hôm nay", "ban-hom-nay.html" + T], ["Thông báo · Hỏi AgiViet", "ban-thong-bao.html" + T], ["Thời tiết", "ban-thoi-tiet.html" + T], ["Tin tức nông nghiệp", "ban-tin-tuc.html" + T]]],
    ["Chợ · bán hàng", [["Hàng đang bán · cần mua", "ban-hang-hoa.html" + T], ["Đăng bài: nói · nhật ký · điền", "ban-dang-bai.html" + T], ["Tin nhắn · lời chào giá", "ban-tin-nhan.html" + T]]],
    ["Hợp đồng", [["Hợp đồng (bấm một dòng để mở chi tiết, ký, cân, tiền)", "ban-hop-dong.html" + T]]],
    ["Vườn", [["Vườn · mùa vụ · nhật ký · cách ly", "ban-vuon.html" + T]]],
    ["Tiền", [["Tiền hàng · lịch sử tiền", "ban-tien.html" + T]]],
    ["Tôi", [["Tôi · cài đặt · hỗ trợ", "ban-toi.html" + T]]],
  ];
  const MUA = [
    ["Vào app", [["Đăng nhập", "dang-nhap"], ["Mã xác minh", "otp"], ["Thông tin tổ chức", "thong-tin-to-chuc"], ["Chọn gói", "chon-goi"]]],
    ["Tổng quan", [["Tổng quan", "tong-quan"]]],
    ["Nguồn hàng", [["Nguồn hàng", "nguon-hang"], ["Gợi ý khớp nhu cầu", "goi-y"], ["Chi tiết lô", "chi-tiet-lo&lo=L-0412"], ["Hồ sơ người bán", "ho-so-ban"]]],
    ["Nhu cầu · báo giá", [["Nhu cầu mua", "nhu-cau"], ["Tạo phiếu nhu cầu", "tao-nhu-cau"], ["Chi tiết nhu cầu", "chi-tiet-nhu-cau"], ["Báo giá", "bao-gia"], ["So báo giá", "so-bao-gia"], ["Chào giá", "gui-bao-gia"]]],
    ["Tin nhắn", [["Tin nhắn", "tin-nhan"], ["Hẹn xem vườn", "hen-xem-vuon"]]],
    ["Đơn", [["Đơn và lịch nhận", "don-hang"], ["Chi tiết đơn HĐ-0018 (15 bước, bấm được)", "chi-tiet-don"], ["Lập thỏa thuận", "thoa-thuan"], ["Đặt cọc", "dat-coc"], ["Đã mở liên lạc", "mo-lien-lac"], ["Nhập kết quả cân", "nghiem-thu"], ["Đọc phiếu cân", "doc-phieu-can"], ["Đối soát", "doi-soat"], ["Lịch nhận và trả tiền", "lich-nhan"], ["Xin hủy", "huy-don"]]],
    ["Tiền", [["Tài khoản đảm bảo", "vi-dam-bao"], ["Công nợ", "cong-no"], ["Chuyển tiền đơn", "ghi-thanh-toan"]]],
    ["Kho", [["Nhập kho", "nhap-kho"], ["Tồn kho", "ton-kho"], ["Truy xuất lô", "truy-xuat"]]],
    ["Nhà cung cấp", [["Mối quen", "moi-quen"], ["Nhập từ Excel", "nhap-excel"], ["Chấm điểm", "cham-diem"], ["Ghi đơn ngoài app", "ghi-don-ngoai"]]],
    ["Kế hoạch · sổ sách", [["Kế hoạch mua", "ke-hoach"], ["Bảng kê thuế 01/TNDN", "bang-ke"], ["Báo cáo", "bao-cao"]]],
    ["Dịch vụ", [["Kiểm định, xe, kho", "dich-vu"], ["Yêu cầu dịch vụ", "yeu-cau-dich-vu"]]],
    ["Tổ chức", [["Thành viên", "thanh-vien"], ["Gói và thanh toán", "goi-cua-toi"], ["So sánh gói", "so-sanh-goi"], ["Nâng cấp", "nang-cap"], ["Đã nâng cấp", "nang-cap-xong"], ["Hồ sơ tổ chức", "ho-so-to-chuc"], ["Uy tín", "uy-tin"]]],
  ].map(([n, ds]) => [n, ds.map(([t, m]) => [t, "mua.html?man=" + m])]);
  const VH = [
    ["Vận hành", [["Tổng quan vận hành", "tong-quan-vh"], ["Hàng chờ xác minh", "duyet-xac-minh"], ["Duyệt hồ sơ", "chi-tiet-xac-minh&ma=XM-311"], ["Kiểm duyệt tin", "kiem-duyet-tin"], ["Lách liên lạc", "canh-bao-lach"], ["Tranh chấp", "tranh-chap"], ["Xử lý tranh chấp", "chi-tiet-tranh-chap"], ["Tiền đảm bảo", "tien-dam-bao"], ["Người dùng", "nguoi-dung"], ["Yêu cầu hỗ trợ", "yeu-cau-ho-tro"], ["Cấu hình phí", "cau-hinh-phi"]]],
  ].map(([n, ds]) => [n, ds.map(([t, m]) => [t, "van-hanh.html?man=" + m])]);

  const MOTION = [
    ["Motion v2", [["Bản mẫu gốc Motion v2 (điện thoại + bảng điều khiển)", "../tham-khao/motion-v2/motion-v2.dc.html"], ["App bán /ban dựng theo Motion v2", "../ban/index.html"]]],
  ];
  const dem = (a) => a.reduce((t, [, ds]) => t + ds.length, 0);
  const ben = document.getElementById("ben");
  [["App bán · Sổ vườn", BAN], ["App bán · Motion v2", MOTION], ["App mua · máy tính + điện thoại", MUA], ["Trang vận hành", VH]].forEach(([ten, ds]) => {
    const dt = document.createElement("details"); dt.open = true;
    dt.innerHTML = `<summary>${ten}<small>${dem(ds)} mục</small></summary>` + ds.map(([n, ms]) => `<div class="nhom">${n}</div>` + ms.map(([t, u]) => `<a href="#${u}">${t}</a>`).join("")).join("");
    ben.appendChild(dt);
  });

  const san = document.getElementById("san");
  const mo = () => {
    const duong = decodeURIComponent(location.hash.slice(1)) || "dang-nhap.html";
    const noi = duong.includes("?") ? "&" : "?";
    const src = `./${duong}${noi}nen=sang&t=${Date.now()}`;
    if (/^(mua|van-hanh)\.html|motion-v2/.test(duong)) {
      const coDt = duong.startsWith("mua");
      const ti = Math.min(1, Math.max(0.4, (innerWidth - 260 - 80 - (coDt ? 440 : 0)) / 1296));
      san.innerHTML = `<div><div class="ban-may" style="--ti:${ti.toFixed(3)}"><iframe id="khung-may" title="Máy tính"></iframe></div><p class="nhan-may">Máy tính 1280 × 820</p></div>` + (coDt ? `<div><div class="may"><iframe id="khung-dt" title="Điện thoại"></iframe></div><p class="nhan-may">Điện thoại 390 × 844 · cùng dữ liệu</p></div>` : "");
      document.getElementById("khung-may").src = src;
      const dt = document.getElementById("khung-dt"); if (dt) dt.src = src;
    } else {
      san.innerHTML = `<div><div class="may"><iframe id="sang" title="Điện thoại"></iframe></div><p class="nhan-may">390 × 844</p></div>`;
      document.getElementById("sang").src = src;
    }
    document.querySelectorAll(".ben a").forEach((a) => a.setAttribute("aria-current", String(a.getAttribute("href") === "#" + duong)));
  };
  addEventListener("hashchange", mo); mo();
  let co; addEventListener("resize", () => { clearTimeout(co); co = setTimeout(mo, 300); });
  let dau = null;
  setInterval(async () => {
    try {
      const tep = (decodeURIComponent(location.hash.slice(1)) || "dang-nhap.html").split("?")[0];
      const ds = ["so-vuon.css", "chung.js", "so-lam-an.css", "so-lam-an.js", "mua.js", "van-hanh.js", tep];
      const t = (await Promise.all(ds.map((f) => fetch("./" + f, { method: "HEAD", cache: "no-store" }).then((r) => r.headers.get("last-modified") || r.headers.get("etag") || "")))).join("|");
      if (dau !== null && t !== dau) mo();
      dau = t;
    } catch {}
  }, 1500);
</script>
</body>
</html>
