  [["Thử quy trình trên hai app", THU], ["App bán · đã chốt (19 màn Sổ vườn) + màn mới chờ duyệt", BAN], ["App bán · đủ 80 màn theo danh mục (đã chốt + màn mới chờ duyệt)", BAN_MAU], ["App bán · Motion v2", MOTION], ["App mua · máy tính + điện thoại", MUA], ["Trang vận hành", VH]].forEach(([ten, ds]) => {
    const dt = document.createElement("details"); dt.open = true;
    dt.innerHTML = `<summary>${ten}<small>${dem(ds)} mục</small></summary>` + ds.map(([n, ms]) => `<div class="nhom">${n}</div>` + ms.map(([t, u]) => `<a href="#${u}">${t}</a>`).join("")).join("");
    ben.appendChild(dt);
  });

  const san = document.getElementById("san");
  const mo = () => {
    const duong = decodeURIComponent(location.hash.slice(1)) || "dang-nhap.html";
    const noi = duong.includes("?") ? "&" : "?";
    const src = `./${duong}${noi}nen=sang&t=${Date.now()}`;
    if (/^(mua|van-hanh)\.html|motion-v2/.test(duong)) {
      const coDt = duong.startsWith("mua");
      const ti = Math.min(1, Math.max(0.4, (innerWidth - 260 - 80 - (coDt ? 440 : 0)) / 1296));
      san.innerHTML = `<div><div class="ban-may" style="--ti:${ti.toFixed(3)}"><iframe id="khung-may" title="Máy tính"></iframe></div><p class="nhan-may">Máy tính 1280 × 820</p></div>` + (coDt ? `<div><div class="may"><iframe id="khung-dt" title="Điện thoại"></iframe></div><p class="nhan-may">Điện thoại 390 × 844 · cùng dữ liệu</p></div>` : "");
      document.getElementById("khung-may").src = src;
      const dt = document.getElementById("khung-dt"); if (dt) dt.src = src;
    } else {
      san.innerHTML = `<div><div class="may"><iframe id="sang" title="Điện thoại"></iframe></div><p class="nhan-may">390 × 844</p></div>`;
      document.getElementById("sang").src = src;
    }
    document.querySelectorAll(".ben a").forEach((a) => a.setAttribute("aria-current", String(a.getAttribute("href") === "#" + duong)));
  };
  addEventListener("hashchange", mo); mo();
  let co; addEventListener("resize", () => { clearTimeout(co); co = setTimeout(mo, 300); });
  let dau = null;
  setInterval(async () => {
    try {
      const tep = (decodeURIComponent(location.hash.slice(1)) || "dang-nhap.html").split("?")[0];
      const ds = ["so-vuon.css", "chung.js", "so-lam-an.css", "so-lam-an.js", "mua.js", "van-hanh.js", tep];
      const t = (await Promise.all(ds.map((f) => fetch("./" + f, { method: "HEAD", cache: "no-store" }).then((r) => r.headers.get("last-modified") || r.headers.get("etag") || "")))).join("|");
      if (dau !== null && t !== dau) mo();
      dau = t;
    } catch {}
  }, 1500);
</script>
