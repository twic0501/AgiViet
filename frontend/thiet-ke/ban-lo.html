<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chi tiết lô · AgiViet bán (bản mẫu)</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="./so-vuon.css">
<style>
  .dau-lui { position: sticky; top: 0; z-index: 12; display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; box-shadow: inset 0 -2px 0 rgba(217, 165, 33, 0.55); }
  .dau-lui a { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: #f6f2e7; text-decoration: none; }
  .dau-lui h1 { font-size: 18px; font-weight: 700; color: #f6f2e7; }
  .anh-lon { aspect-ratio: 16 / 9; border-radius: 18px; background: var(--giay-lot) center / cover no-repeat; position: relative; }
  .anh-lon .minh-hoa { position: absolute; left: 10px; bottom: 10px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,.5); color: #fff; }
  .tieu-de h2 { font-size: 22px; font-weight: 700; }
  .tieu-de p { font-size: 14px; color: var(--muc-phu); margin-top: 2px; }
  .tieu-de .tt { display: inline-block; margin-top: 8px; font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--la-nhat); color: var(--la-dam); }
  .o-gia { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .o-gia > div { padding: 10px 12px; border-radius: 14px; background: var(--giay-noi); border: 1px solid var(--ke); min-width: 0; }
  .o-gia b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .o-gia b small { display: block; font-size: 12px; font-weight: 500; color: var(--muc-nhat); }
  .o-gia span { font-size: 12.5px; color: var(--muc-nhat); }
  .o-gia .kin { background: var(--vang-lua-nhat); border-color: transparent; }
  dl.bang { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; margin-top: 12px; font-size: 14px; }
  dl.bang dt { color: var(--muc-phu); }
  dl.bang dd { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .luong { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--ke); margin-top: 12px; }
  .luong i { display: block; height: 100%; }
  .giay { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--ke); }
  .giay:last-child { border-bottom: 0; }
  .giay .bt { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--la-nhat); color: var(--la-dam); }
  .giay .bt svg { width: 20px; height: 20px; }
  .giay .ten { font-weight: 600; }
  .giay .phu { font-size: 13px; color: var(--muc-nhat); }
  .giay .tt { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--la-nhat); color: var(--la-dam); white-space: nowrap; }
  .giay .tt.chua { background: var(--chin-nen); color: var(--chin); }
  .chao { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 12px; border-radius: 12px; background: var(--giay-lot); text-decoration: none; color: inherit; font-size: 14px; margin-top: 8px; }
  .chao .gia { font-weight: 700; text-align: right; }
  .chao .phu { font-size: 13px; color: var(--muc-nhat); }
  .ghi { font-size: 13px; color: var(--muc-nhat); margin-top: 8px; line-height: 1.45; }
</style>
</head>
<body>
<div class="trang">
  <header class="dau-lui nen-xanh"><a href="./ban-hang-hoa.html" aria-label="Về Chợ"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><h1 id="t-lo">Chi tiết lô</h1></header>
  <main class="noi" id="noi" aria-busy="true" style="gap:16px">
    <div id="noi-dung"><div class="khung-tai"></div><div class="khung-tai"></div></div>
  </main>
</div>
<script type="module">
import { can, esc, phien, ANH_SP, giuThamSo, veTab, tenLoai } from "./chung.js";
const $ = (id) => document.getElementById(id);
veTab("cho");
const ngay = (s) => (s ? new Date(s).toLocaleDateString("vi-VN", { day: "numeric", month: "numeric", year: "numeric" }) : "—");
const dong = (v) => `${Number(v || 0).toLocaleString("vi-VN")} đ/kg`;
const soGia = (v) => (v ? `${Number(v).toLocaleString("vi-VN")}<small>đ/kg</small>` : "—");
const TT = { on_sale: "Đang bán", draft: "Nháp", reserved: "Đang giữ cho đơn", sold_out: "Đã bán hết", closed: "Đã ngừng bán", paused: "Tạm ngưng" };
const IC_GIAY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13l2 2 4-4"/></svg>';
const THI_TRUONG = { TQ: "Trung Quốc", HQ: "Hàn Quốc", NB: "Nhật Bản", EU: "châu Âu", US: "Mỹ" };

async function mo() {
  const id = new URLSearchParams(location.search).get("id");
  if (!id) throw new Error("Thiếu mã lô");
  const token = await phien();
  const get = (d) => fetch(d, { headers: { authorization: "Bearer " + token } }).then((r) => (r.ok ? r.json() : Promise.reject(new Error(`${r.status}`))));
  const [l, nguon, chao] = await Promise.all([get(`/v1/lots/${id}`), get(`/v1/lots/${id}/source-profile`).catch(() => null), get("/v1/offers").catch(() => [])]);
  const g = await get(`/v1/reference-prices?product=${encodeURIComponent(l.product_code)}&grade=${encodeURIComponent(l.grade_code)}`).catch(() => null);
  $("t-lo").textContent = `Lô ${l.code}`;
  const anh = ANH_SP(l.product_code);
  const q = l.qty || {};
  const phan = [["Còn bán", q.available, "var(--la)"], ["Đang giữ", q.held, "#e2b24a"], ["Trong hợp đồng", BigInt(q.committed || 0) + BigInt(q.in_transit || 0), "#4f7fb8"], ["Đã giao", q.delivered, "#9aa59f"]].map(([t, v, c]) => [t, Number(v || 0), c]);
  const tong = phan.reduce((s, [, v]) => s + v, 0) || 1;
  const chaoLo = (Array.isArray(chao) ? chao : []).filter((c) => c.lot_code === l.code && /sent|countered/.test(c.status));
  const giay = nguon?.giay_to || [];
  $("noi-dung").innerHTML = `
    <div class="anh-lon" style="${anh ? `background-image:url(${anh})` : ""}">${l.photos?.length ? "" : '<span class="minh-hoa">Ảnh minh họa · lô chưa có ảnh chụp</span>'}</div>
    <section class="tieu-de" style="margin-top:14px"><h2>${esc(l.product_name)}</h2><p>${esc(tenLoai(l.grade_code))} · ${l.qty_basis === "estimated" ? "lượng ước tính (cam kết tối đa 80%)" : "đã cân"}</p>
      <span class="tt">${esc(TT[l.status] || l.status)}${l.urgent_sale_until && new Date(l.urgent_sale_until) > new Date() ? " · đang bán nhanh" : ""}</span></section>
    <div class="o-gia"><div><b>${soGia(l.ask_price_vnd)}</b><span>giá mong muốn</span></div>
      <div class="kin"><b>${soGia(l.floor_price_vnd)}</b><span>giá thấp nhất · kín</span></div>
      <div><b>${soGia(g?.price_vnd)}</b><span>giá tham khảo</span></div></div>

    <section class="muc" style="margin-top:20px"><h3><span>Lượng hàng</span><span style="font-weight:400">${esc(can(l.declared_qty_g).join(" "))} đã khai</span></h3>
      <div class="luong">${phan.filter(([, v]) => v).map(([t, v, c]) => `<i title="${t}" style="width:${(v / tong * 100).toFixed(1)}%;background:${c}"></i>`).join("")}</div>
      <dl class="bang">${phan.map(([t, v]) => `<dt>${t}</dt><dd>${esc(can(v).join(" "))}</dd>`).join("")}</dl></section>

    <section class="muc" style="margin-top:20px"><h3><span>Thời gian và nơi trồng</span></h3>
      <dl class="bang"><dt>Có hàng từ</dt><dd>${ngay(l.available_from)}</dd>
        <dt>Hết cách ly thuốc</dt><dd>${ngay(l.spray_clear_on)}</dd>
        <dt>Báo còn hàng lần cuối</dt><dd>${ngay(l.last_confirmed_at)}</dd>
        <dt>Vườn</dt><dd>${esc(nguon?.vi_tri?.ten || "—")}</dd></dl>
      ${nguon?.vi_tri?.ghi_chu ? `<p class="ghi">${esc(nguon.vi_tri.ghi_chu)}</p>` : ""}</section>

    <section class="muc" style="margin-top:20px"><h3><span>Giấy tờ của lô</span><span style="font-weight:400">${giay.length}</span></h3>
      ${giay.length ? giay.map((x) => `<div class="giay"><span class="bt">${IC_GIAY}</span>
        <span><p class="ten">${esc(x.label_vi)}</p><p class="phu">${x.market ? `Thị trường ${esc(THI_TRUONG[x.market] || x.market)} · ` : ""}Hiệu lực ${ngay(x.tu)} – ${ngay(x.den)}</p></span>
        <span class="tt ${x.trang_thai === "da_xac_minh" ? "" : "chua"}">${x.trang_thai === "da_xac_minh" ? "Đã xác minh" : "Bác tự khai"}</span></div>`).join("")
        : '<p class="ghi">Lô chưa có giấy tờ. Bên mua xuất khẩu, nhà máy thường cần VietGAP hoặc mã số vùng trồng.</p>'}</section>

    <section class="muc" style="margin-top:20px"><h3><span>Lời chào trên lô</span><span style="font-weight:400">${chaoLo.length}</span></h3>
      ${chaoLo.length ? chaoLo.map((c) => { const v = c.vong_cuoi || {}; return `<a class="chao" href="./ban-tin-nhan.html">
        <span><b>${c.direction === "seller_quote" ? `Bác chào ${esc(c.buyer_name || "bên mua")}` : `${esc(c.buyer_name || "Bên mua")} chào`}</b><p class="phu">${esc(can(v.qty_g).join(" "))} · ${v.from_side === "buyer" ? "chờ bác trả lời" : "chờ bên mua"}</p></span>
        <span class="gia">${dong(v.price_vnd)}</span></a>`; }).join("") : '<p class="ghi">Chưa có lời chào nào.</p>'}</section>
    <p class="ghi">Sửa giá, bật bán nhanh hoặc ngừng bán: bấm "Quản lý lô" ở màn Chợ.</p>`;
  giuThamSo();
}
mo().catch((e) => { $("noi-dung").innerHTML = `<p class="bao loi">Chưa mở được lô (${esc(e.message)}).</p>`; }).finally(() => $("noi").setAttribute("aria-busy", "false"));
</script>
</body>
</html>
