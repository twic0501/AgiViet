<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nhắn tin · AgiViet bán (bản mẫu)</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="./so-vuon.css">
<style>
  /* Màn 38 Nhắn tin trực tiếp (kiểu Zalo) — theo hệ Sổ vườn đã chốt. Dữ liệu mô phỏng, chưa nối backend. Tiền tố tc- */
  .tc-ds { display: grid; }
  .tc-dong { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--ke); text-decoration: none; color: inherit; }
  .tc-anh { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--la-nhat); color: var(--la-dam); font-weight: 700; font-size: 18px; position: relative; }
  .tc-anh .tc-xm { position: absolute; right: -2px; bottom: -2px; width: 20px; height: 20px; border-radius: 50%; background: var(--la); color: #f6f2e7; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--giay); }
  .tc-dong b { display: block; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tc-dong small { display: block; font-size: 14px; color: var(--muc-nhat); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tc-dong.tc-moi small { color: var(--muc); font-weight: 600; }
  .tc-ben { display: grid; justify-items: end; gap: 4px; font-size: 13px; color: var(--muc-nhat); }
  .tc-dem { min-width: 22px; height: 22px; border-radius: 11px; background: var(--dau-do); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; }
  .tc-ghi { font-size: 14px; color: var(--muc-nhat); line-height: 1.45; }
  .tc-khoa-bao { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: #e3e9f4; color: #2b4f86; font-size: 14px; line-height: 1.45; }
  .tc-khoa-bao svg { flex: none; margin-top: 2px; }
  /* Khung chat */
  .tc-chat { display: grid; gap: 6px; padding-bottom: 8px; }
  .tc-ngay { justify-self: center; font-size: 13px; color: var(--muc-nhat); background: var(--giay-lot); padding: 3px 10px; border-radius: 10px; margin: 6px 0; }
  .tc-tin { max-width: 82%; padding: 9px 13px; border-radius: 18px; line-height: 1.45; animation: tc-vao 260ms cubic-bezier(.23,1,.32,1) both; }
  @keyframes tc-vao { from { transform: translateY(8px) scale(.97); opacity: 0; } }
  .tc-tin small { display: block; font-size: 12px; margin-top: 2px; opacity: .7; }
  .tc-ho { justify-self: start; background: var(--giay-noi); border: 1px solid var(--ke); border-bottom-left-radius: 6px; }
  .tc-toi { justify-self: end; background: var(--la); color: #f6f2e7; border-bottom-right-radius: 6px; }
  .tc-tin.tc-co-anh { padding: 4px; }
  .tc-tin .tc-hinh { width: 210px; aspect-ratio: 4 / 3; border-radius: 14px; background: center / cover; }
  .tc-tin .tc-hinh + small { padding: 2px 8px; }
  .tc-che { background: rgba(0, 0, 0, .14); border-radius: 6px; padding: 0 4px; letter-spacing: .1em; }
  .tc-he { justify-self: center; max-width: 94%; display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: #2b4f86; background: #e3e9f4; padding: 8px 12px; border-radius: 12px; line-height: 1.45; }
  .tc-he.tc-canh { color: var(--dau-do); background: var(--dau-do-nen); }
  .tc-he svg { flex: none; margin-top: 2px; }
  .tc-gia { justify-self: stretch; margin: 4px 0; background: var(--giay-noi); border-radius: 18px; border: 1.5px solid #e3c77a; padding: 14px; display: grid; gap: 8px; animation: tc-vao 300ms cubic-bezier(.23,1,.32,1) both; }
  .tc-gia.tc-cua-toi { border-color: var(--la); }
  .tc-gia-dau { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .tc-gia-so { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tc-nhan { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 12px; white-space: nowrap; background: var(--cho-nen); color: var(--cho); }
  .tc-nhan.tc-n-bac { background: var(--dau-do-nen); color: var(--dau-do); }
  .tc-nhan.tc-n-xong { background: var(--la-nhat); color: var(--la-dam); }
  .tc-hai { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tc-hai .nut { width: 100%; min-height: 48px; }
  .tc-vang { background: #f4c84e !important; color: #1f1503 !important; }
  .tc-khong { background: none; border: 0; color: var(--dau-do); font: 600 15px var(--chu); min-height: 44px; cursor: pointer; }
  /* Thanh gõ dính đáy */
  .tc-day { position: sticky; bottom: 0; background: var(--giay); border-top: 1px solid var(--ke); padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); display: grid; gap: 8px; z-index: 5; }
  .tc-nhanh { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .tc-nhanh::-webkit-scrollbar { display: none; }
  .tc-nhanh button { flex: none; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--ke-dam); background: var(--giay-noi); font: 600 14px var(--chu); color: var(--la); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .tc-go { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 8px; align-items: end; }
  .tc-go textarea { min-height: 44px; max-height: 120px; resize: none; border-radius: 22px; border: 1.5px solid var(--ke-dam); background: var(--giay-noi); padding: 10px 16px; font: 400 16px/1.4 var(--chu); color: var(--muc); }
  .tc-go textarea:focus { outline: none; border-color: var(--la); }
  .tc-go button { width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: var(--giay-lot); color: var(--la); }
  .tc-go button.tc-gui { background: var(--la); color: #f6f2e7; }
  /* Tấm */
  .tc-che-nen { position: fixed; inset: 0; z-index: 40; background: rgba(15, 22, 17, .45); display: flex; align-items: flex-end; justify-content: center; }
  .tc-tam { width: min(100%, 480px); max-height: 90dvh; overflow-y: auto; background: var(--giay); border-radius: 22px 22px 0 0; display: grid; gap: 14px; padding: 18px 16px 0; animation: tc-len 300ms cubic-bezier(.23,1,.32,1) both; }
  @keyframes tc-len { from { transform: translateY(100%); } }
  .tc-tam h2 { font-size: 20px; }
  .tc-tam label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; color: var(--muc-phu); }
  .tc-tam input { min-height: 52px; border-radius: 14px; border: 1.5px solid var(--ke-dam); background: var(--giay-lot); padding: 0 14px; font: 500 17px var(--chu); color: var(--muc); width: 100%; min-width: 0; box-sizing: border-box; }
  .tc-tam-day { position: sticky; bottom: 0; margin: 0 -16px; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: var(--giay); border-top: 1px solid var(--ke); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
  .tc-tam-day .nut { min-height: 52px; }
  .tc-dong-tien { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--ke); }
  .tc-dong-tien span { color: var(--muc-phu); }
  @media (prefers-reduced-motion: reduce) { .tc-tin, .tc-gia, .tc-tam { animation: none; } }
</style>
</head>
<body>
<div class="trang">
  <header class="dau dau-xanh nen-xanh" id="dau"></header>
  <main class="noi" id="noi" style="gap:12px"></main>
</div>
<script type="module">
import { esc, giuThamSo } from "./chung.js";
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const MA = q.get("ma");
const so = (n) => Number(n).toLocaleString("vi-VN");
const SVG = (p, w = 20) => `<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${p}"/></svg>`;
const I = { lui: "M15 5l-7 7 7 7", khien: "M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z", canh: "M12 3l10 18H2zM12 10v5M12 18v.5", anh: "M4 7h3l2-3h6l2 3h3v13H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z", gui: "M4 12l16-8-6 16-2-7z", can: "M12 4v16M5 8h14M5 8l-3 6a3 3 0 0 0 6 0zM19 8l-3 6a3 3 0 0 0 6 0z", lich: "M4 5h16v16H4zM4 10h16M8 3v4M16 3v4", co: "M5 21V4h11l-2 4 2 4H5", dien: "M5 4h4l2 5-3 2a11 11 0 0 0 5 5l2-3 5 2v4a1 1 0 0 1-1 1A17 17 0 0 1 4 5a1 1 0 0 1 1-1z", tich: "M5 12l5 5 9-10" };

// ── Dữ liệu mô phỏng (cùng tình huống HĐ-0018 với app mua) ──
const KHOA = "agv-tro-chuyen-v1";
const DAU = [
  { ma: "T1", ben: "Nhà máy sấy Đồng Xanh", nguoi: "Chị Thu Hà", lo: "L-0412", xm: true, chuaDoc: 1, moLienLac: false, tin: [
    { k: "he", t: "Hai bên nhắn qua AgiViet. Số điện thoại che tới khi ngân hàng giữ cọc.", luc: "08:00" },
    { k: "tin", ai: "ho", t: "Chào chị Năm, em bên Đồng Xanh. Xoài lô L-0412 còn đủ 2 tấn loại 1 không chị?", luc: "08:02" },
    { k: "tin", ai: "toi", t: "Dạ còn 3,5 tấn em. Trái 350–550 g, hái 27/10.", luc: "08:10" },
    { k: "anh", ai: "toi", anh: "/assets/products/xoai-cat-chu.jpg", luc: "08:11" },
    { k: "gia", ai: "ho", gia: 22500, luong: 2000, ghi: "Giao tại vườn, bên mua lo xe", luc: "08:20", trang: "da-tra" },
    { k: "gia", ai: "toi", gia: 23500, luong: 2000, ghi: "Bác trả lại", luc: "08:31", trang: "da-tra" },
    { k: "gia", ai: "ho", gia: 23000, luong: 2000, ghi: "Lượt trả giá cuối của bên mua", luc: "09:05", trang: "cho-bac" },
    { k: "tin", ai: "ho", t: "Chị đồng ý 23 ngàn thì em soạn thỏa thuận luôn nha.", luc: "09:06" },
  ] },
  { ma: "T2", ben: "Vựa Ba Cường", nguoi: "Anh Cường", lo: "L-0413", xm: false, chuaDoc: 1, moLienLac: false, tin: [
    { k: "tin", ai: "ho", t: "Chị ơi loại 2 bao nhiêu một ký?", luc: "16:40" },
    { k: "tin", ai: "toi", t: "15 ngàn em, có 800 ký.", luc: "16:52" },
    { k: "tin", ai: "ho", t: "Chị gọi em số ••• ••• ••• cho lẹ", luc: "17:01", che: true },
    { k: "he", canh: true, t: "Tin vừa rồi có số điện thoại nên đã bị che. Trao đổi liên lạc trước khi có cọc là vi phạm (lần 1/3 của bên mua).", luc: "17:01" },
  ] },
  { ma: "T3", ben: "Nhà hàng Bếp Sen", nguoi: "Anh Khoa", lo: "L-0412", xm: true, chuaDoc: 0, moLienLac: true, tin: [
    { k: "he", t: "Hợp đồng khung HĐ-0011 có hiệu lực, ngân hàng đã giữ cọc. Liên lạc đã mở.", luc: "20/10" },
    { k: "tin", ai: "ho", t: "Thứ Sáu này chị giao 50 ký như tuần trước nha.", luc: "07:30" },
    { k: "tin", ai: "toi", t: "Dạ được em.", luc: "07:41" },
  ] },
];
let ds; try { ds = JSON.parse(localStorage.getItem(KHOA)); } catch {}
if (!Array.isArray(ds)) ds = structuredClone(DAU);
let viPham = Number(localStorage.getItem(KHOA + "-vp")) || 0;
const luu = () => { try { localStorage.setItem(KHOA, JSON.stringify(ds)); localStorage.setItem(KHOA + "-vp", String(viPham)); } catch {} };

// Phát hiện liên lạc (mô phỏng): ≥ 8 chữ số (kể cả đọc bằng chữ), Zalo/Facebook/@
const SO_CHU = { "không": 0, "một": 1, "mốt": 1, "hai": 2, "ba": 3, "bốn": 4, "tư": 4, "năm": 5, "lăm": 5, "sáu": 6, "bảy": 7, "tám": 8, "chín": 9 };
function quet(t) {
  const thap = t.toLowerCase();
  const doi = thap.split(/\s+/).map((w) => (w in SO_CHU ? String(SO_CHU[w]) : w)).join(" ");
  const coSo = /(\d[\s.\-_]*){8,}/.test(doi);
  const coKenh = /\b(zalo|zl|facebook|fb|messenger|viber|telegram|sđt|sdt)\b|@[a-z0-9_.]{3,}|kết bạn/.test(thap);
  if (!coSo && !coKenh) return { sach: true, che: t };
  let che = t.replace(/(\d[\s.\-_]*){8,}/g, (x) => "••• ••• •••" + (/\s$/.test(x) ? " " : "")).replace(/\b(zalo|zl|facebook|fb|messenger|viber|telegram)\b/gi, "•••").replace(/@[A-Za-z0-9_.]{3,}/g, "•••");
  if (coSo && che === t) che = "Tin có số điện thoại đọc bằng chữ (đã che)";
  return { sach: false, che, loai: coSo ? "số điện thoại" : "kênh nhắn ngoài" };
}

const nutLui = (den) => `<button class="nut-tron" type="button" id="dong" data-den="${den}" aria-label="Quay lại">${SVG(I.lui, 22)}</button>`;
const ganLui = () => { const b = $("dong"); b.onclick = () => { location.href = b.dataset.den + location.search.replace(/[?&]ma=[^&]*/, "").replace(/^&/, "?"); }; };

// ── Danh sách hội thoại ──
function veDanhSach() {
  $("dau").innerHTML = `${nutLui("./ban-tin-nhan.html")}<div style="flex:1;min-width:0"><p class="chao">Tin nhắn</p><h1>Trò chuyện với bên mua</h1></div>`;
  $("noi").innerHTML = `
    <div class="tc-khoa-bao">${SVG(I.khien)}<span>Nhắn qua AgiViet để có bằng chứng khi tranh chấp. Số điện thoại hai bên che tới khi ngân hàng giữ cọc.</span></div>
    <div class="tc-ds">${ds.map((h) => {
      const cuoi = h.tin.filter((m) => m.k !== "he").at(-1);
      const chu = cuoi.k === "gia" ? `${cuoi.ai === "toi" ? "Bác" : "Bên mua"} trả ${so(cuoi.gia)} đ/kg` : cuoi.k === "anh" ? "Ảnh" : cuoi.t;
      return `<a class="tc-dong ${h.chuaDoc ? "tc-moi" : ""}" href="./ban-tro-chuyen.html?ma=${h.ma}"><span class="tc-anh">${esc(h.ben.split(" ").at(-1)[0])}${h.xm ? `<span class="tc-xm" title="Đã xác minh">${SVG(I.tich, 12)}</span>` : ""}</span>
        <span style="min-width:0"><b>${esc(h.ben)}</b><small>${esc(chu)}</small></span>
        <span class="tc-ben"><span>${esc(cuoi.luc)}</span>${h.chuaDoc ? `<span class="tc-dem">${h.chuaDoc}</span>` : ""}</span></a>`;
    }).join("")}</div>
    <p class="tc-ghi">Lời chào giá chính thức vẫn ở mục Tin nhắn. Ở đây hai bên trao đổi, gửi ảnh hàng và trả giá ngay trong cuộc nhắn.</p>`;
  ganLui(); giuThamSo();
}

// ── Khung chat ──
const veTin = (m) => {
  if (m.k === "he") return `<div class="tc-he ${m.canh ? "tc-canh" : ""}">${SVG(m.canh ? I.canh : I.khien, 16)}<span>${esc(m.t)}</span></div>`;
  if (m.k === "anh") return `<div class="tc-tin tc-co-anh ${m.ai === "toi" ? "tc-toi" : "tc-ho"}"><div class="tc-hinh" style="background-image:url(${esc(m.anh)})" role="img" aria-label="Ảnh hàng"></div><small>${esc(m.luc)}</small></div>`;
  if (m.k === "gia") {
    const toi = m.ai === "toi", cho = m.trang === "cho-bac" && !toi;
    const nhan = m.trang === "dong-y" ? `<span class="tc-nhan tc-n-xong">Hai bên đã đồng ý</span>` : m.trang === "khong" ? `<span class="tc-nhan">Bác không bán</span>` : cho ? `<span class="tc-nhan tc-n-bac">Chờ bác trả lời</span>` : `<span class="tc-nhan">${toi ? "Chờ bên mua" : "Đã trả lại"}</span>`;
    return `<div class="tc-gia ${toi ? "tc-cua-toi" : ""}"><div class="tc-gia-dau"><b>${toi ? "Bác trả giá" : "Bên mua trả giá"}</b>${nhan}</div>
      <span class="tc-gia-so">${so(m.gia)} đ/kg</span><span class="tc-ghi">${so(m.luong)} kg · thành tiền ${so(m.gia * m.luong)} đ · ${esc(m.ghi || "")}</span>
      ${cho ? `<div class="tc-hai"><button type="button" class="nut phu-nut" data-gia="tra">Trả giá</button><button type="button" class="nut tc-vang" data-gia="dong-y">Đồng ý ${so(m.gia)}</button></div><button type="button" class="tc-khong" data-gia="khong">Không bán</button>` : ""}</div>`;
  }
  return `<div class="tc-tin ${m.ai === "toi" ? "tc-toi" : "tc-ho"}">${m.che ? esc(m.t).replace(/•••[ •]*/g, (x) => `<span class="tc-che">${x}</span>`) : esc(m.t)}<small>${esc(m.luc)}</small></div>`;
};
function veChat(h) {
  $("dau").innerHTML = `${nutLui("./ban-tro-chuyen.html")}<div style="flex:1;min-width:0"><p class="chao">${esc(h.nguoi)} · lô ${esc(h.lo)}${h.moLienLac ? " · liên lạc đã mở" : ""}</p><h1>${esc(h.ben)}</h1></div>
    <button class="nut-tron" type="button" id="goi" aria-label="${h.moLienLac ? "Gọi" : "Gọi qua app, che số"}">${SVG(I.dien, 22)}</button>`;
  ganLui();
  $("noi").innerHTML = `<div class="tc-chat" id="chat"><span class="tc-ngay">Hôm nay</span>${h.tin.map(veTin).join("")}</div>`;
  const day = document.createElement("div"); day.className = "tc-day";
  day.innerHTML = `<div class="tc-nhanh"><button type="button" id="tra-gia">${SVG(I.can, 18)}Trả giá</button><button type="button" id="gui-anh">${SVG(I.anh, 18)}Gửi ảnh hàng</button><button type="button" id="hen">${SVG(I.lich, 18)}Hẹn xem vườn</button><button type="button" id="bao">${SVG(I.co, 18)}Báo cáo</button></div>
    <div class="tc-go"><button type="button" id="chup" aria-label="Chụp ảnh">${SVG(I.anh, 22)}</button><textarea id="go" rows="1" placeholder="Nhắn cho ${esc(h.nguoi)}" aria-label="Nội dung tin nhắn"></textarea><button type="button" class="tc-gui" id="gui" aria-label="Gửi">${SVG(I.gui, 22)}</button></div>`;
  document.querySelector(".trang").appendChild(day);
  if (h.chuaDoc) { h.chuaDoc = 0; luu(); }
  requestAnimationFrame(() => scrollTo(0, document.body.scrollHeight));
  const gio = () => new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
  const them = (m) => { h.tin.push(m); luu(); $("chat").insertAdjacentHTML("beforeend", veTin(m)); scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); };
  const go = $("go");
  go.addEventListener("input", () => { go.style.height = "auto"; go.style.height = Math.min(120, go.scrollHeight) + "px"; });
  $("gui").addEventListener("click", () => {
    const chu = go.value.trim(); if (!chu) return;
    if (!h.moLienLac && viPham >= 3) { them({ k: "he", canh: true, t: "Bác đang bị tạm khóa nhắn 24 giờ sau lần vi phạm thứ 3.", luc: gio() }); window.HieuUngThem?.rung($("gui")); return; }
    const kq = h.moLienLac ? { sach: true, che: chu } : quet(chu);
    go.value = ""; go.style.height = "auto";
    them({ k: "tin", ai: "toi", t: kq.che, luc: gio(), che: !kq.sach });
    if (!kq.sach) { viPham++; luu(); them({ k: "he", canh: true, t: `Tin có ${kq.loai} nên đã bị che. Trao đổi liên lạc trước khi ngân hàng giữ cọc là vi phạm (lần ${viPham}/3). ${viPham >= 3 ? "Bác đã bị tạm khóa nhắn 24 giờ." : "Lần 3 sẽ tạm khóa nhắn 24 giờ."}`, luc: gio() }); return; }
    // Bên kia đang gõ rồi trả lời (mô phỏng)
    const g = document.createElement("div"); g.className = "tc-tin tc-ho"; g.innerHTML = '<span class="hu-cham" aria-label="Bên mua đang gõ"><i></i><i></i><i></i></span>';
    setTimeout(() => { $("chat").appendChild(g); scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); }, 500);
    setTimeout(() => { g.remove(); them({ k: "tin", ai: "ho", t: "Dạ em ghi nhận, cảm ơn chị.", luc: gio() }); }, 2200);
  });
  const tam = (html, gan) => {
    const n = document.createElement("div"); n.className = "tc-che-nen";
    n.innerHTML = `<div class="tc-tam" role="dialog" aria-modal="true">${html}</div>`;
    const dong = () => n.remove();
    n.addEventListener("click", (e) => { if (e.target === n || e.target.closest("[data-dong]")) dong(); });
    addEventListener("keydown", function esc2(e) { if (e.key === "Escape") { dong(); removeEventListener("keydown", esc2); } });
    document.body.appendChild(n); gan?.(n, dong);
  };
  const guiAnh = () => them({ k: "anh", ai: "toi", anh: "/assets/products/xoai-cat-chu.jpg", luc: gio() });
  $("gui-anh").addEventListener("click", guiAnh);
  $("chup").addEventListener("click", () => tam(`<h2>Gửi ảnh</h2><p class="tc-ghi">Ảnh có số điện thoại, Zalo hoặc mã QR liên lạc sẽ không gửi đi và bị tính vi phạm.</p><div class="tc-tam-day"><button class="nut phu-nut" type="button" data-dong>Đóng</button><button class="nut chinh-nut" type="button" id="chon-anh">Chụp ảnh hàng</button></div>`, (n, dong) => n.querySelector("#chon-anh").addEventListener("click", () => { dong(); guiAnh(); })));
  $("hen").addEventListener("click", () => tam(`<h2>Hẹn xem vườn</h2><label>Ngày<input type="date" id="ngay-hen"></label><label>Giờ<input value="8:00"></label><p class="tc-ghi">Địa chỉ chi tiết chỉ gửi khi hai bên đồng ý lịch hẹn.</p><div class="tc-tam-day"><button class="nut phu-nut" type="button" data-dong>Đóng</button><button class="nut chinh-nut" type="button" id="gui-hen">Gửi lời hẹn</button></div>`, (n, dong) => n.querySelector("#gui-hen").addEventListener("click", () => { dong(); them({ k: "he", t: "Bác đã gửi lời hẹn xem vườn lúc 8:00. Chờ bên mua xác nhận.", luc: gio() }); })));
  $("bao").addEventListener("click", () => tam(`<h2>Báo cáo bên mua này</h2>${["Đòi số điện thoại, Zalo trước khi có cọc", "Ép giá, dọa bỏ", "Nói lời khiếm nhã", "Nghi lừa đảo"].map((t, i) => `<label style="flex-direction:row;display:flex;gap:10px;align-items:center;min-height:48px;font-weight:500;color:var(--muc)"><input type="radio" name="bc" ${i ? "" : "checked"} style="width:22px;min-height:22px">${t}</label>`).join("")}<div class="tc-tam-day"><button class="nut phu-nut" type="button" data-dong>Đóng</button><button class="nut chinh-nut" type="button" id="gui-bc">Gửi báo cáo</button></div>`, (n, dong) => n.querySelector("#gui-bc").addEventListener("click", () => { dong(); them({ k: "he", t: "AgiViet đã nhận báo cáo của bác, nhân viên sẽ xem trong 24 giờ.", luc: gio() }); })));
  const moTraGia = (giaCu = 23000) => tam(`<h2>Bác trả giá</h2><p class="tc-ghi">Lô ${esc(h.lo)} · bên mua có 24 giờ để trả lời.</p><div class="tc-hai"><label>Giá (đ/kg)<input id="g" inputmode="numeric" value="${giaCu + 500}"></label><label>Lượng (kg)<input id="l" inputmode="numeric" value="2000"></label></div>
    <div class="tc-tam-day"><button class="nut phu-nut" type="button" data-dong>Đóng</button><button class="nut tc-vang" type="button" id="gui-gia">Gửi giá</button></div>`,
    (n, dong) => n.querySelector("#gui-gia").addEventListener("click", () => {
      const g = Number(n.querySelector("#g").value.replace(/\D/g, "")), l = Number(n.querySelector("#l").value.replace(/\D/g, ""));
      if (!(g >= 1000) || !(l > 0)) { window.HieuUng?.loiTruong(n.querySelector(g >= 1000 ? "#l" : "#g"), "Bác nhập số hợp lệ"); return; }
      dong(); h.tin.forEach((m) => { if (m.trang === "cho-bac") m.trang = "da-tra"; });
      document.querySelectorAll("[data-gia]").forEach((b) => b.remove());
      them({ k: "gia", ai: "toi", gia: g, luong: l, ghi: "Bác trả lại", luc: gio(), trang: "cho-mua" });
    }));
  $("tra-gia").addEventListener("click", () => moTraGia());
  $("chat").addEventListener("click", (e) => {
    const b = e.target.closest("[data-gia]"); if (!b) return;
    const m = h.tin.find((x) => x.trang === "cho-bac"); if (!m) return;
    if (b.dataset.gia === "tra") return moTraGia(m.gia);
    if (b.dataset.gia === "khong") { m.trang = "khong"; luu(); location.reload(); return; }
    tam(`<h2>Đồng ý bán?</h2><div class="tc-dong-tien"><span>Lượng</span><b>${so(m.luong)} kg</b></div><div class="tc-dong-tien"><span>Giá</span><b>${so(m.gia)} đ/kg</b></div><div class="tc-dong-tien"><span>Thành tiền</span><b>${so(m.gia * m.luong)} đ</b></div>
      <p class="tc-ghi">Hàng được giữ 24 giờ cho bên mua. <b>Chưa phải hợp đồng</b>: hai bên xem lại thỏa thuận rồi mới ký.</p>
      <div class="tc-tam-day"><button class="nut phu-nut" type="button" data-dong>Quay lại</button><button class="nut tc-vang" type="button" id="chot">Xác nhận đồng ý</button></div>`,
      (n, dong) => n.querySelector("#chot").addEventListener("click", async (ev) => {
        await window.HieuUngThem?.nutXong(ev.currentTarget, "Đã đồng ý");
        dong(); m.trang = "dong-y";
        h.tin.push({ k: "he", t: `Hai bên đã đồng ý ${so(m.gia)} đ/kg cho ${so(m.luong)} kg. Bên mua đang soạn thỏa thuận HĐ-0018.`, luc: gio() }); luu(); location.reload();
      }));
  });
  $("goi").addEventListener("click", () => tam(`<h2>${h.moLienLac ? "Gọi " + esc(h.nguoi) : "Gọi qua app"}</h2><p class="tc-ghi">${h.moLienLac ? "Liên lạc đã mở vì ngân hàng đã giữ cọc." : "Cuộc gọi đi qua AgiViet, hai bên không thấy số của nhau tới khi ngân hàng giữ cọc."}</p><div class="tc-tam-day"><button class="nut phu-nut" type="button" data-dong>Đóng</button><button class="nut chinh-nut" type="button" data-dong>Gọi</button></div>`));
}

const h = MA && ds.find((x) => x.ma === MA);
if (h) veChat(h); else veDanhSach();
</script>
</body>
</html>
