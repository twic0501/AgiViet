<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trâu Rive thử · AgiViet</title>
<style>
 :root{--nen:#f7f8f2;--chu:#233c31;--vien:#d9e2d6}
 body{margin:0;background:var(--nen);color:var(--chu);font-family:'Be Vietnam Pro',system-ui,sans-serif}
 main{max-width:460px;margin:0 auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
 h1{font-size:1.05rem;margin:4px 0 0}.ghi{font-size:.85rem;color:#4b5f55;text-align:center;margin:0}
 canvas{width:min(360px,90vw);height:min(360px,90vw)}
 .nut{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
 button{font:inherit;border:1px solid var(--vien);background:#fff;color:var(--chu);border-radius:999px;padding:8px 12px;min-height:40px}
</style>
<main>
 <h1>Trâu vector v3 · chuyển động Rive</h1>
 <p class="ghi">Đang chạy: thở, chớp mắt, tai vẫy, đuôi đung đưa, nhìn qua lại kiểu giả 3D (mắt + mõm trượt, tai trễ, khuôn đầu gần như yên).</p>
 <canvas id="c" width="720" height="720"></canvas>
 <div class="nut"><button type="button" id="nen">Đổi nền tối/sáng</button></div>
 <p class="ghi">Bản vẽ v3 của Codex (khăn rằn kẻ, tay găng, có đáy quần). Rê chuột hoặc chạm để trâu nhìn theo. Thở có hơi phả từ mũi.</p>
</main>
<script src="https://unpkg.com/@rive-app/canvas@2.21.6/rive.js"></script>
<script>
 const r = new rive.Rive({ src: '../assets/trau/trau.riv?v=' + Date.now(), canvas: document.getElementById('c'), autoplay: true, stateMachines: 'trau',
   layout: new rive.Layout({ fit: rive.Fit.Contain }), onLoad: () => r.resizeDrawingSurfaceToCanvas() });
 document.getElementById('nen').onclick = () => { const b = document.body.style; b.background = b.background ? '' : '#233c31'; };
</script>
</html>
