global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/canh-bao.yml]
alerting:
  alertmanagers:
    - static_configs: [{targets: ['alertmanager:9093']}]
scrape_configs:
  - job_name: api
    static_configs: [{targets: ['api:8080']}]
  - job_name: postgres
    static_configs: [{targets: ['postgres-exporter:9187']}]
