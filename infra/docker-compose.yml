# MÔI TRƯỜNG GIẢ LẬP; không triển khai production trực tiếp.
name: agiviet-infra
x-api-env: &api-env
  DATABASE_URL: postgres://agiviet_owner:agiviet_dev_only@db:5432/agiviet_bench
  AI_URL: http://ai:8090
  PDF_MODE: queue
  REF_PRICE_SOURCE: mv
  DOC_DIR: /data/docs
  UPLOAD_DIR: /data/uploads
  QR_SECRET: ${QR_SECRET:-dev-only-qr-secret}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-only-webhook-secret}
  PG_POOL_MAX: 10
  WORKERS: 1
x-stub: &stub
  build: ./stub
  init: true
  restart: unless-stopped
  volumes:
    - artifacts:/data
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  db:
    extends:
      file: ../db/docker-compose.yml
      service: db
    ports: !override
      - '127.0.0.1:55432:5432'
    mem_limit: 2g
    cpus: 2
  setup:
    <<: *stub
    profiles: [setup]
    restart: 'no'
    environment:
      <<: *api-env
      DATABASE_URL_ADMIN: postgres://agiviet_owner:agiviet_dev_only@db:5432/postgres
    command: [node, db-setup.mjs]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *stub
    environment: *api-env
    depends_on:
      db: {condition: service_healthy}
      ai: {condition: service_healthy}
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 35s
  ai:
    <<: *stub
    command: [node, ai.mjs]
    environment: {PORT: 8090, AI_SLOTS: 4, AI_QUEUE_MAX: 50}
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
  pdf-worker:
    <<: *stub
    command: [node, worker.mjs]
    environment: *api-env
    mem_limit: 512m
    cpus: 1
    depends_on:
      api: {condition: service_healthy}
    stop_grace_period: 35s
  proxy:
    mem_limit: 128m
    cpus: 0.25
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:8088:80']
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  prometheus:
    mem_limit: 512m
    cpus: 0.5
    image: prom/prometheus:v3.2.1
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=7d']
    volumes:
      - ./giam-sat/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./giam-sat/canh-bao.yml:/etc/prometheus/canh-bao.yml:ro
      - prometheus:/prometheus
    ports: ['127.0.0.1:9090:9090']
    restart: unless-stopped
  postgres-exporter:
    mem_limit: 128m
    cpus: 0.25
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://agiviet_owner:agiviet_dev_only@db:5432/agiviet_bench?sslmode=disable
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  alertmanager:
    mem_limit: 128m
    cpus: 0.25
    image: prom/alertmanager:v0.28.1
    command: ['--config.file=/etc/alertmanager/alertmanager.yml']
    volumes: ['./giam-sat/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro']
    ports: ['127.0.0.1:9093:9093']
    restart: unless-stopped
volumes:
  # Tên mặc định do compose DB gốc tạo khi chạy từ db/. Không xóa volume này.
  agiviet_v2_pgdata:
    name: ${AGV_PG_VOLUME:-db_agiviet_v2_pgdata}
  artifacts:
  prometheus:
