events { worker_connections 1024; }
http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=bank:10m rate=350r/s;
  limit_req_status 429;
  log_format timings '$remote_addr $request_method $uri $status rt=$request_time upstream=$upstream_response_time';
  access_log /dev/stdout timings;
  error_log /dev/stderr warn;
  gzip on;
  gzip_types application/json text/css application/javascript;
  client_max_body_size 5m;
  client_body_timeout 15s;
  upstream backend { server api:8080; keepalive 32; }
  server {
    listen 80;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location = / { default_type text/plain; return 200 'AgiViet: moi truong ha tang GIA LAP. API /v1/. Hai app chua duoc gan vao.\n'; }
    location = /ban/ { default_type text/plain; return 200 'APP BAN: cho ban build that; backend hien la stub GIA LAP.\n'; }
    location = /mua/ { default_type text/plain; return 200 'APP MUA: cho ban build that; backend hien la stub GIA LAP.\n'; }
    # Không công khai endpoint quản trị hoặc dữ liệu đo tải.
    location /v1/_bench/ { return 404; }
    location = /metrics { return 404; }
    location = /health { proxy_pass http://backend; }
    location = /ready { proxy_pass http://backend; }
    location = /v1/webhooks/bank {
      limit_req zone=bank burst=600 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      proxy_next_upstream off;
    }
    location /v1/ {
      limit_req zone=api burst=100 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      proxy_next_upstream off;
    }
  }
}
